name: Rust
on:
  push: { branches: [main] }
  pull_request:
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  DATABASE_URL: postgres://sideroom:sideroom_ci@localhost:5432/sideroom
  # The Postgres-backed suites (#[ignore]d unless this is set) run in their own step below.
  SR_TEST_DATABASE_URL: postgres://sideroom:sideroom_ci@localhost:5432/sideroom
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  fmt-clippy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sideroom
          POSTGRES_PASSWORD: sideroom_ci
          POSTGRES_DB: sideroom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sideroom" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - uses: mozilla-actions/sccache-action@v0.0.6
      - run: echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-nextest,cargo-deny" }
      # FND-CI-002: sqlx queries are runtime-checked (sqlx::query), not macros, so there is
      # no offline metadata (.sqlx/) to verify. Revisit if query! macros are ever adopted.
      - name: sqlx offline metadata check (no-op by design)
        run: echo "no compile-time-checked queries; nothing to prepare"
      # D-268 / L-13: the opt-out of bot voice (no openmls, no str0m) must keep compiling and passing.
      - name: sr-sdk without default features
        run: |
          cargo build -p sr-sdk --no-default-features
          cargo build -p sr-sdk --no-default-features --features voice-transport
          cargo build -p sr-sdk --no-default-features --features voice-e2ee
          cargo build -p sr-sdk --no-default-features --features voice-opus
          cargo clippy -p sr-sdk --no-default-features --all-targets -- -D warnings
          cargo clippy -p sr-sdk --no-default-features --features voice-opus --all-targets -- -D warnings
          cargo test -p sr-sdk --no-default-features
          cargo test -p sr-sdk --no-default-features --features voice-opus --lib
      - run: cargo nextest run --workspace
      # D-163 / F-01: the #[ignore]d Postgres suites (sr-db). Single-threaded because the tests
      # share one database; sr-storage's live S3 suite has its own workflow (storage.yml).
      - name: Postgres-backed tests (ignored suite)
        run: cargo nextest run --workspace --exclude sr-storage --run-ignored only -j1
      # OPS-IMM-002 (wave 28): the IMMUTABLE RULE harness (crates/sr-server/tests/immutable_rules.rs) is one of the
      # #[ignore]d suites above, so it runs there on every build: every feature killed, every setting at both ends of its
      # range, and the refusal phase of the authorization matrix, the access log, the audit log and the log chain still
      # hold. This step only fails when the harness is no longer in that suite (a harness that does not run proves nothing).
      - name: The IMMUTABLE RULE harness is in the ignored suite (OPS-IMM-002)
        shell: bash
        run: |
          listed="$(cargo nextest list --workspace --exclude sr-storage --run-ignored only 2>/dev/null)"
          grep -q 'refusals_and_logs_hold_in_every_flag_state' <<< "$listed"
      - run: cargo deny check
