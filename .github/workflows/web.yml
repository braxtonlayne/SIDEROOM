name: Web
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Same toolchain setup as wasm.yml: the web app imports the WASM bundle from @sideroom/wasm.
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: 'wasm-pack' }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds packages/wasm/dist, which the web build and tests load.
      - run: pnpm --filter @sideroom/wasm build
      # M-01 (D-287): the served notices file is a copy of the root file.
      - run: node scripts/check-notices-copy.mjs
      - run: pnpm -r --if-present lint
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test
      - run: pnpm --filter @sideroom/web build
      # K-13, M-08: production dependency licences against an allow-list (GPL-3.0 only for rvfc-polyfill, LGPL for jassub).
      - name: Licence allow-list
        run: pnpm licenses list --json --prod | node scripts/check-licenses.mjs
      # XC-PERF-002: first-load JavaScript per section stays inside the gzip budgets in scripts/bundle-budget.json.
      - name: Bundle budget
        run: node scripts/check-bundle-budget.mjs
      # SEC-ENT-004 (D-385): a visitor without a login gets only the code their page needs. Per public surface: the
      # budget, the allowed modules, no app identifier, no preload or import() outside /entrance/, no source map; the
      # plain-HTML pages carry no script. The output lists every surface with "ok".
      - name: Entrance isolation
        run: node scripts/check-entrance-isolation.mjs
      # SEC-AUD-170 (D-651): staff-only chunks sit under dist/app/staff/, app.html and member chunks never load them,
      # and no staff entry marker is outside that directory.
      - name: Staff delivery
        run: node scripts/check-staff-delivery.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7

  # XC-A11Y-004, XC-PWA, XC-SEC: axe on the public routes, the service worker's boundaries and the enforced
  # CSP, against the production build. No API or database needed.
  static-browser-checks:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - run: ./scripts/playwright-install.sh chromium
      # D-289: the committed sticker PNGs are reproducible from their SVG sources.
      - run: node scripts/render-stickers.mjs --check
      - run: pnpm --filter @sideroom/e2e test:static
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: static-checks-traces
          path: e2e/test-results
          retention-days: 7

  # ACT-A3D-001, the wave 46 gate proof: the arena3d starter's deterministic replay gives the Node hash in Chromium,
  # Firefox and WebKit, and two players over the fake platform see each other. No sr-server, database, WASM or web
  # build: the bundle is built here and served as static files. If an engine disagrees, report it to the owner
  # (roadmap change 11); never switch engines or skip it.
  arena3d-replay:
    runs-on: ubuntu-latest
    # 20: a stalled browser install now retries (scripts/playwright-install.sh caps each attempt at 6 minutes).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/build-activities.mjs arena3d
      - run: ./scripts/playwright-install.sh chromium firefox webkit
      - run: pnpm --filter @sideroom/e2e test:arena3d
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: arena3d-replay-traces
          path: e2e/test-results
          retention-days: 7

  # XC-SEC-006: dependency advisories. An advisory signal, not a gate: a new CVE in a transitive dependency
  # must not block unrelated pull requests. Needs the network, so it cannot run on the agent machines.
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm audit --prod --audit-level high
