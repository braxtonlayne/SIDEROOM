name: OpenAPI drift
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: openapi-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: extractions/setup-just@v2
      - run: just gen-api
      - name: Fail if generated client differs from committed
        run: git diff --exit-code -- packages/api-client
      - name: Fail if generated MSW handlers differ from openapi.json (XC-TEST-003)
        run: pnpm --filter @sideroom/api-client mocks:check
