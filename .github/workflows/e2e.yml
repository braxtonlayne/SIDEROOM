name: E2E
# FND-CI-004: Phase 0 exit-gate and entrance smoke tests (e2e/), one job per browser.
on:
  push: { branches: [main] }
  pull_request:
  # L-20 (D-275): a manual dispatch runs only the visual-baselines job.
  workflow_dispatch:
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
env:
  DATABASE_URL: postgres://sideroom:sideroom_dev@127.0.0.1:5432/sideroom
  # sr-cli and sr-server read the SR_-prefixed form; without it they fall back to the built-in
  # default (a different password than the compose database).
  SR_DATABASE__URL: postgres://sideroom:sideroom_dev@127.0.0.1:5432/sideroom
  CARGO_TERM_COLOR: always
permissions:
  contents: read
jobs:
  playwright:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-stack
      - name: Install the browser
        run: pnpm --filter @sideroom/e2e exec playwright install --with-deps ${{ matrix.browser }}
      - name: Migrate, start the server, run Playwright
        # global-setup.ts bootstraps the Owner; e2e-run.sh starts sr-server and stops it afterwards.
        run: |
          ./target/debug/sr-cli migrate
          ./deploy/compose/e2e-run.sh --project=${{ matrix.browser }}
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.browser }}
          path: |
            e2e/playwright-report
            e2e/test-results
            server.log

  # VOX-E2E-003, DEV-ACT-001, D-243/D-244: features that need the SFU, voice E2EE and Activities switched on.
  # One sr-server run per suite (registration allows 20 accounts per address and day, counted in memory).
  live:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SR_VOICE__ENABLED: "true"
      # Voice E2EE is on by default in sr-server and the web build (D-249), so the first step runs voice and Activities
      # calls encrypted with the defaults; the E2EE steps set SR_VOICE__E2EE explicitly.
      SR_ACTIVITIES__ENABLED: "true"
      # The staff offer card spec appoints staff; the e2e Owner has no second factor.
      SR_ADMIN_REQUIRE_REAUTH: "0"
      # The dev server forwards <id>.activities.localhost:5173 to sr-server (apps/web/vite/activityHosts.ts).
      VITE_ACTIVITIES_ENABLED: "true"
      SR_E2E_VOICE: "1"
      SR_E2E_ACTIVITIES: "1"
      SR_E2E_LIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-stack
      - name: Install the browsers
        run: pnpm --filter @sideroom/e2e exec playwright install --with-deps chromium firefox webkit
      - name: Voice, Activities and message components (Chromium)
        run: |
          ./target/debug/sr-cli migrate
          ./deploy/compose/e2e-run.sh --project=chromium tests/voice-live.spec.ts tests/activities-live.spec.ts tests/message-components.spec.ts
        env:
          CI: "true"
      - name: Voice E2EE (Chromium)
        if: always()
        run: |
          cp server.log server-live.log || true
          ./deploy/compose/e2e-run.sh -c playwright.e2ee.config.ts --project=chromium
          cp server.log server-e2ee-chromium.log || true
        env:
          CI: "true"
          SR_VOICE__E2EE: "true"
      # Required since run 39224043323 passed it 5 of 5 (--repeat-each=5 --retries=0), which turned the E2EE defaults
      # on (D-249, VOX-E2E-003).
      - name: Voice E2EE (Firefox)
        if: always()
        run: |
          # Firefox never paired its candidates with the SFU's default 127.0.0.1 here: ICE failed when the 5 s
          # trickle grace period ended (run 39157431844). Announce the runner's default-route address instead
          # (scripts/ice-announce.mjs says why; docs/dev/handoff/fix-firefox-e2ee.md has the evidence).
          SR_VOICE__ANNOUNCE_IPS="$(node scripts/ice-announce.mjs)"
          export SR_VOICE__ANNOUNCE_IPS
          echo "SFU announces $SR_VOICE__ANNOUNCE_IPS"
          # Firefox's AudioContext never finished resuming on the runner (most likely no audio output device), so
          # give it a PulseAudio null sink. Best effort: the run goes on without it. The package lists are fresh
          # from the browser install step.
          if sudo apt-get install -y -qq --no-install-recommends pulseaudio >/dev/null; then
            { pulseaudio --start --exit-idle-time=-1 &&
              pactl load-module module-null-sink sink_name=sr_null >/dev/null &&
              pactl set-default-sink sr_null; } || echo "PulseAudio null sink not available"
          fi
          status=0
          ./deploy/compose/e2e-run.sh -c playwright.e2ee.config.ts --project=firefox || status=$?
          # The WebKit step reuses the report folder and server.log: keep Firefox's.
          cp server.log server-e2ee-firefox.log || true
          cp -r e2e/playwright-report-e2ee e2e/playwright-report-e2ee-firefox || true
          cp -r e2e/test-results-e2ee e2e/test-results-e2ee-firefox || true
          exit "$status"
        env:
          CI: "true"
          SR_VOICE__E2EE: "true"
          # SFU signalling and ICE detail in server.log, in case Firefox fails.
          SR_LOG__FILTER: "info,sr_voice=debug,str0m=debug"
      # Informational: Playwright's Linux WebKit has no RTCRtpScriptTransform, so the spec skips itself with a reason
      # (the `capabilities` annotation in the report). Safari itself is untested.
      - name: Voice E2EE (WebKit)
        if: always()
        continue-on-error: true
        run: |
          SR_VOICE__ANNOUNCE_IPS="$(node scripts/ice-announce.mjs)"
          export SR_VOICE__ANNOUNCE_IPS
          ./deploy/compose/e2e-run.sh -c playwright.e2ee.config.ts --project=webkit
        env:
          CI: "true"
          SR_VOICE__E2EE: "true"
      # RDY-VOX-001: voice through a TURN relay. coturn runs the PRODUCTION template (turnserver.prod.conf.example,
      # rendered by deploy/compose/coturn/render-test-conf.sh) on the host network; sr-server hands out REST credentials
      # derived from the same secret (voice.turn.secret) and the browsers are forced to `iceTransportPolicy: 'relay'`.
      # The spec proves the relay with the selected candidate pair type in getStats. The dev `coturn` service of the
      # preflight step below uses the same port, so this one is removed again at the end.
      - name: Voice through TURN relay (Chromium)
        if: always()
        run: |
          ip="$(node scripts/ice-announce.mjs | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0]')"
          secret="$(openssl rand -hex 16)"
          ./deploy/compose/coturn/render-test-conf.sh "$ip" "$secret"
          docker compose -f deploy/compose/dev.yml --profile relay up -d coturn-relay
          sleep 3
          docker compose -f deploy/compose/dev.yml --profile relay logs coturn-relay | tail -20
          export SR_VOICE__ANNOUNCE_IPS="[\"$ip\"]"
          export SR_VOICE__TURN__SECRET="$secret"
          export SR_VOICE__TURN__URLS="[\"turn:$ip:3478?transport=udp\"]"
          status=0
          ./deploy/compose/e2e-run.sh --project=chromium tests/voice-relay.spec.ts --retries=0 || status=$?
          cp server.log server-relay.log || true
          docker compose -f deploy/compose/dev.yml --profile relay logs coturn-relay > coturn-relay.log 2>&1 || true
          docker compose -f deploy/compose/dev.yml --profile relay rm -sf coturn-relay || true
          exit "$status"
        env:
          CI: "true"
          SR_E2E_RELAY: "1"
      # RDY-MED-002: Cinema > Submit in the browser against this job's Garage (SR_E2E_LIVE=1 is set for the job). A
      # member uploads a generated MP4 to a series draft through the presigned part PUT, and a broken part PUT is
      # finished from the IndexedDB ledger after a reload. The reviewer-proxy test needs ffprobe (SR_E2E_FFMPEG=1,
      # not set here) and skips itself.
      - name: Cinema submit over Garage (Chromium)
        if: always()
        run: |
          status=0
          ./deploy/compose/e2e-run.sh --project=chromium tests/cinema-submit.spec.ts || status=$?
          cp server.log server-cinema.log || true
          exit "$status"
        env:
          CI: "true"
      # RDY-OPS-004: the preflight's TURN row against the dev stack's coturn (deploy/compose/dev.yml, same shared
      # secret as deploy/compose/coturn/turnserver.conf): credentials derive and a UDP allocation is granted. Only the
      # turn row is asserted; the other rows describe this runner, not a production box.
      - name: sr-cli preflight TURN allocation against coturn
        if: always()
        run: |
          docker compose -f deploy/compose/dev.yml up -d coturn
          sleep 3
          ./target/debug/sr-cli preflight --json > preflight.json || true
          node -e '
            const r = JSON.parse(require("fs").readFileSync("preflight.json", "utf8"));
            const t = r.checks.find((c) => c.id === "turn");
            console.log(JSON.stringify(t));
            if (!t || t.status !== "pass") process.exit(1);
          '
        env:
          SR_STORAGE__ENDPOINT: "memory:"
          SR_VOICE__TURN__SECRET: dev-turn-shared-secret
          SR_VOICE__TURN__URLS: '["turn:127.0.0.1:3478?transport=udp"]'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-live
          path: |
            e2e/playwright-report
            e2e/playwright-report-e2ee
            e2e/test-results
            e2e/test-results-e2ee
            server.log
            server-live.log
            server-e2ee-chromium.log
            server-e2ee-firefox.log
            server-relay.log
            server-cinema.log
            coturn-relay.log
            e2e/playwright-report-e2ee-firefox
            e2e/test-results-e2ee-firefox

  # L-20, D-275 (P16-E2E-1): generates the linux Chromium baselines for e2e/tests/visual.spec.ts. Manual only; it never
  # commits or pushes (contents: read). A human downloads the artifact and commits it. The report-only "visual" job
  # (L-21) lands after the first set is committed.
  # L-21 (D-275): visual regression against the committed linux baselines. Report-only until it has
  # passed on main for two weeks / 20 runs (L-22); no retries, so a flaky diff shows as one.
  visual:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-stack
      - name: Install the browser
        run: pnpm --filter @sideroom/e2e exec playwright install --with-deps chromium
      - name: Visual specs
        run: |
          ./target/debug/sr-cli migrate
          ./deploy/compose/e2e-run.sh --project=chromium tests/visual.spec.ts --retries=0
        env:
          CI: "true"
          SR_E2E_VISUAL: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-visual
          path: |
            e2e/playwright-report
            e2e/test-results
            server.log
          if-no-files-found: ignore

  visual-baselines:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-stack
      - name: Install the browser
        run: pnpm --filter @sideroom/e2e exec playwright install --with-deps chromium
      - name: Generate the baselines
        run: |
          ./target/debug/sr-cli migrate
          ./deploy/compose/e2e-run.sh --project=chromium tests/visual.spec.ts --update-snapshots
        env:
          CI: "true"
          SR_E2E_VISUAL: "1"
      - name: Job summary
        if: always()
        run: |
          dir=e2e/tests/visual.spec.ts-snapshots
          count=$(ls "$dir"/*-chromium-linux.png 2>/dev/null | wc -l)
          {
            echo "## Visual baselines (linux, Chromium)"
            echo
            echo "Generated $count baseline PNG(s). Nothing was committed or pushed."
            echo
            echo "1. Download the visual-baselines-linux artifact from this run and unzip it into $dir/."
            echo "2. Commit the *-chromium-linux.png files on a branch and open a PR."
            echo "3. Refresh them in the same PR as a Playwright or Chromium bump or an intended change to a captured page."
            echo
            ls -1 "$dir"/*-chromium-linux.png 2>/dev/null | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: e2e/tests/visual.spec.ts-snapshots/*-chromium-linux.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-baselines-report
          path: |
            e2e/playwright-report
            e2e/test-results
            server.log
