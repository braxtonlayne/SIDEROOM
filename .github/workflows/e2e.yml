name: E2E
# FND-CI-004: Phase 0 exit-gate and entrance smoke tests (e2e/), one job per browser.
on:
  push: { branches: [main] }
  pull_request:
  # L-20 (D-275): a manual dispatch runs only the visual-baselines job.
  workflow_dispatch:
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
env:
  DATABASE_URL: postgres://sideroom:sideroom_dev@127.0.0.1:5432/sideroom
  # sr-cli and sr-server read the SR_-prefixed form; without it they fall back to the built-in
  # default (a different password than the compose database).
  SR_DATABASE__URL: postgres://sideroom:sideroom_dev@127.0.0.1:5432/sideroom
  CARGO_TERM_COLOR: always
permissions:
  contents: read
jobs:
  playwright:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 45: WebKit took 26 minutes before the two exit-gate specs got their own step (RDY-DEV-005, RDY-MOD-001).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-stack
      - name: Install the browser
        run: pnpm --filter @sideroom/e2e exec playwright install --with-deps ${{ matrix.browser }}
      - name: Migrate, start the server, run Playwright
        # global-setup.ts bootstraps the Owner; e2e-run.sh starts sr-server and stops it afterwards.
        # The two exit gates (tagged @gate) run in the next step on a server of their own: registration allows 20
        # accounts per address and day, counted in memory, and the gates register seven between them.
        run: |
          ./target/debug/sr-cli migrate
          ./deploy/compose/e2e-run.sh --project=${{ matrix.browser }} --grep-invert @gate
        env:
          CI: "true"
      - name: Exit gates of phase 6 and 7 (developer-gate, moderation-gate)
        # RDY-DEV-005: portal, OAuth2 install, a bot answers a slash command, a reviewed release installs on a second
        # server. RDY-MOD-001: report, case, ban, appeal, takedown and counter-notice, duplicate account, data request
        # export and erasure, audit and access log. Both need the gateway and the REST API only (no voice, no
        # Activities); staff reauth stays ON (the gate enrols a second factor). A failure in the main step above must not
        # hide these, and the other way round, so each step reports on its own.
        #
        # The report, the traces and the server log go to files of their own, so this run does not overwrite those of the
        # main step.
        if: ${{ !cancelled() }}
        run: |
          mv server.log server-main.log 2>/dev/null || true
          ./deploy/compose/e2e-run.sh --project=${{ matrix.browser }} --grep @gate --output=test-results-gate
        env:
          CI: "true"
          PLAYWRIGHT_HTML_REPORT: playwright-report-gate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ matrix.browser }}
          path: |
            e2e/playwright-report
            e2e/playwright-report-gate
            e2e/test-results
            e2e/test-results-gate
            server.log
            server-main.log

  # SEC-ENT-004 (D-385): the built bundle behind the real gate. sr-server serves apps/web/dist itself (SR_E2E_WEB=server:
  # SR_WEB__ROOT, SR_WEB__SERVE_PUBLIC=true), so the pages and the API share one origin on :8080, a visitor without a
  # session gets only a public surface's files and a 302 or 401 for everything else, and a sign-in is a document
  # load into /app. The first step runs the static isolation check on the same dist, so the log lists every surface.
  built-bundle:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      SR_E2E_WEB: server
      SR_E2E_BASE_URL: http://localhost:8080
      SR_WEB__SERVE_PUBLIC: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-stack
      - name: Install the browser
        run: pnpm --filter @sideroom/e2e exec playwright install --with-deps ${{ matrix.browser }}
      - name: Build the web app (VITE_SR_E2E skips the first-run welcome, as the dev server leg does)
        run: pnpm --filter @sideroom/web build
        env:
          VITE_SR_E2E: "1"
      - name: Entrance isolation check on this dist
        run: node scripts/check-entrance-isolation.mjs
      - name: Entrance isolation, entrance smoke and the sign-in journey against the built bundle
        run: |
          export SR_WEB__ROOT="$PWD/apps/web/dist"
          ./target/debug/sr-cli migrate
          ./deploy/compose/e2e-run.sh --project=${{ matrix.browser }} tests/entrance-isolation.spec.ts tests/entrance-smoke.spec.ts tests/entrance-journey.spec.ts
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-built-bundle-${{ matrix.browser }}
          path: |
            e2e/playwright-report
            e2e/test-results
            server.log

  # VOX-E2E-003, DEV-ACT-001, D-243/D-244: features that need the SFU, voice E2EE and Activities switched on.
  # One sr-server run per suite (registration allows 20 accounts per address and day, counted in memory).
  live:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 75: the cinema step installs ffmpeg, builds sr-transcoder and waits for a CPU proxy and ladder (RDY-MED-002).
    timeout-minutes: 75
    env:
      SR_VOICE__ENABLED: "true"
      # End-to-end encryption is the only voice mode (D-249, OPS-IMM-001): there is no setting for it, so every voice and
      # Activities call below is encrypted and the three E2EE steps run the same spec in each engine.
      SR_ACTIVITIES__ENABLED: "true"
      # The staff offer card spec appoints staff; the e2e Owner has no second factor.
      SR_ADMIN_REQUIRE_REAUTH: "0"
      # The dev server forwards <id>.activities.localhost:5173 to sr-server (apps/web/vite/activityHosts.ts).
      VITE_ACTIVITIES_ENABLED: "true"
      SR_E2E_VOICE: "1"
      SR_E2E_ACTIVITIES: "1"
      SR_E2E_LIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-stack
      - name: Install the browsers
        run: pnpm --filter @sideroom/e2e exec playwright install --with-deps chromium firefox webkit
      - name: Voice, Activities, message components and the keyboard voice flow (Chromium)
        run: |
          ./target/debug/sr-cli migrate
          ./deploy/compose/e2e-run.sh --project=chromium tests/voice-live.spec.ts tests/activities-live.spec.ts tests/message-components.spec.ts tests/keyboard-6-voice.spec.ts
        env:
          CI: "true"
      - name: Voice E2EE (Chromium)
        if: always()
        run: |
          cp server.log server-live.log || true
          ./deploy/compose/e2e-run.sh --project=chromium tests/voice-e2ee.spec.ts
          cp server.log server-e2ee-chromium.log || true
        env:
          CI: "true"
      # Required since run 39224043323 passed it 5 of 5 (--repeat-each=5 --retries=0), which turned the E2EE defaults
      # on (D-249, VOX-E2E-003).
      - name: Voice E2EE (Firefox)
        if: always()
        run: |
          # Firefox never paired its candidates with the SFU's default 127.0.0.1 here: ICE failed when the 5 s
          # trickle grace period ended (run 39157431844). Announce the runner's default-route address instead
          # (scripts/ice-announce.mjs says why; docs/dev/handoff/fix-firefox-e2ee.md has the evidence).
          SR_VOICE__ANNOUNCE_IPS="$(node scripts/ice-announce.mjs)"
          export SR_VOICE__ANNOUNCE_IPS
          echo "SFU announces $SR_VOICE__ANNOUNCE_IPS"
          # Firefox's AudioContext never finished resuming on the runner (most likely no audio output device), so
          # give it a PulseAudio null sink. Best effort: the run goes on without it. The package lists are fresh
          # from the browser install step.
          if sudo apt-get install -y -qq --no-install-recommends pulseaudio >/dev/null; then
            { pulseaudio --start --exit-idle-time=-1 &&
              pactl load-module module-null-sink sink_name=sr_null >/dev/null &&
              pactl set-default-sink sr_null; } || echo "PulseAudio null sink not available"
          fi
          status=0
          ./deploy/compose/e2e-run.sh --project=firefox tests/voice-e2ee.spec.ts || status=$?
          # The WebKit step reuses the report folder and server.log: keep Firefox's.
          cp server.log server-e2ee-firefox.log || true
          cp -r e2e/playwright-report e2e/playwright-report-e2ee-firefox || true
          cp -r e2e/test-results e2e/test-results-e2ee-firefox || true
          exit "$status"
        env:
          CI: "true"
          # SFU signalling and ICE detail in server.log, in case Firefox fails.
          SR_LOG__FILTER: "info,sr_voice=debug,str0m=debug"
      # Informational: Playwright's Linux WebKit has no RTCRtpScriptTransform, so the spec skips itself with a reason
      # (the `capabilities` annotation in the report). Safari itself is untested.
      - name: Voice E2EE (WebKit)
        if: always()
        continue-on-error: true
        run: |
          SR_VOICE__ANNOUNCE_IPS="$(node scripts/ice-announce.mjs)"
          export SR_VOICE__ANNOUNCE_IPS
          ./deploy/compose/e2e-run.sh --project=webkit tests/voice-e2ee.spec.ts
        env:
          CI: "true"
      # RDY-VOX-001: voice through a TURN relay. coturn runs the PRODUCTION template (turnserver.prod.conf.example,
      # rendered by deploy/compose/coturn/render-test-conf.sh) on the host network; sr-server hands out REST credentials
      # derived from the same secret (voice.turn.secret) and the browsers are forced to `iceTransportPolicy: 'relay'`.
      # The spec proves the relay with the selected candidate pair type in getStats. The dev `coturn` service of the
      # preflight step below uses the same port, so this one is removed again at the end.
      - name: Voice through TURN relay (Chromium)
        if: always()
        run: |
          ip="$(node scripts/ice-announce.mjs | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8"))[0]')"
          secret="$(openssl rand -hex 16)"
          ./deploy/compose/coturn/render-test-conf.sh "$ip" "$secret"
          docker compose -f deploy/compose/dev.yml --profile relay up -d coturn-relay
          sleep 3
          docker compose -f deploy/compose/dev.yml --profile relay logs coturn-relay | tail -20
          export SR_VOICE__ANNOUNCE_IPS="[\"$ip\"]"
          export SR_VOICE__TURN__SECRET="$secret"
          export SR_VOICE__TURN__URLS="[\"turn:$ip:3478?transport=udp\"]"
          status=0
          ./deploy/compose/e2e-run.sh --project=chromium tests/voice-relay.spec.ts --retries=0 || status=$?
          cp server.log server-relay.log || true
          docker compose -f deploy/compose/dev.yml --profile relay logs coturn-relay > coturn-relay.log 2>&1 || true
          docker compose -f deploy/compose/dev.yml --profile relay rm -sf coturn-relay || true
          exit "$status"
        env:
          CI: "true"
          SR_E2E_RELAY: "1"
      # RDY-MED-002 needs a real ffmpeg for its reviewer-proxy test: ffmpeg from apt on this runner (owner-approved in
      # wave 22, the same package media.yml installs), and the sr-transcoder worker that turns the upload into the
      # review proxy and the ladder. Nothing else is downloaded.
      - name: Install ffmpeg and build sr-transcoder
        if: always()
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -n 1
          ffprobe -hide_banner -version | head -n 1
          cargo build -p sr-transcoder
          ./target/debug/sr-transcoder --check --force-cpu
      # RDY-MED-002: Cinema > Submit in the browser against this job's Garage (SR_E2E_LIVE=1 is set for the job). A
      # member uploads a generated MP4 to a series draft through the presigned part PUT; a broken part PUT is
      # finished from the IndexedDB ledger after a reload; and with SR_E2E_FFMPEG=1 a real four-second MP4 is probed
      # by sr-server (it spawns ffprobe, SR_FFPROBE), transcoded by an sr-transcoder worker the spec starts with an
      # Owner-minted token, sent for review, and the reviewer's proxy player opens it.
      - name: Cinema submit over Garage (Chromium)
        if: always()
        run: |
          SR_FFPROBE="$(command -v ffprobe)"
          export SR_FFPROBE
          echo "sr-server spawns $SR_FFPROBE"
          status=0
          ./deploy/compose/e2e-run.sh --project=chromium tests/cinema-submit.spec.ts --retries=0 || status=$?
          cp server.log server-cinema.log || true
          exit "$status"
        env:
          CI: "true"
          SR_E2E_FFMPEG: "1"
          SR_TRANSCODER_BIN: ${{ github.workspace }}/target/debug/sr-transcoder
          SR_E2E_WORKER_LOG: ${{ github.workspace }}/worker-cinema.log
      # RDY-LIB-001 (D-368, T-02): the Library exit gate on all three browsers, against this job's Garage. A member
      # sends ten chapters (ZIPs built by the spec from generated pages), a reviewer approves nine and sends one back
      # with a reason the member sees, the chapter is fixed and published, and a reader opens the RTL chapter at a phone
      # size while a second context of the same member follows the page position. One server run for the three
      # projects (registration is limited per address and day). The device half stays in dev/owner-checklist.md.
      - name: Library exit gate over Garage (Chromium, Firefox, WebKit)
        if: always()
        run: |
          status=0
          ./deploy/compose/e2e-run.sh --project=chromium --project=firefox --project=webkit tests/library-gate.spec.ts --retries=0 || status=$?
          cp server.log server-library.log || true
          exit "$status"
        env:
          CI: "true"
      # RDY-OPS-004: the preflight's TURN row against the dev stack's coturn (deploy/compose/dev.yml, same shared
      # secret as deploy/compose/coturn/turnserver.conf): credentials derive and a UDP allocation is granted. Only the
      # turn row is asserted; the other rows describe this runner, not a production box.
      - name: sr-cli preflight TURN allocation against coturn
        if: always()
        run: |
          docker compose -f deploy/compose/dev.yml up -d coturn
          sleep 3
          ./target/debug/sr-cli preflight --json > preflight.json || true
          node -e '
            const r = JSON.parse(require("fs").readFileSync("preflight.json", "utf8"));
            const t = r.checks.find((c) => c.id === "turn");
            console.log(JSON.stringify(t));
            if (!t || t.status !== "pass") process.exit(1);
          '
        env:
          SR_STORAGE__ENDPOINT: "memory:"
          SR_VOICE__TURN__SECRET: dev-turn-shared-secret
          SR_VOICE__TURN__URLS: '["turn:127.0.0.1:3478?transport=udp"]'
      # RDY-DEV-002, RDY-DEV-001: the first-party voice bots for one minute each against this job's
      # sr-server and its SFU. The bot joins a voice channel, drops its own SFU WebSocket once and must resume it
      # (VoiceLink); e2e/sdk-compat/voice-bot-live.mjs makes the server and the channel, runs the example and checks
      # its output. The server's public URL is the loopback one, so the bot reaches the gateway and the SFU directly.
      - name: First-party voice bots (sr-sdk, then @sideroom/bot with sr-sdk as partner; one minute each)
        if: always()
        timeout-minutes: 25
        run: |
          set -a; . deploy/compose/.env.example; set +a
          export SR_STORAGE__ENDPOINT=http://127.0.0.1:3900 SR_STORAGE__REGION=garage
          export SR_STORAGE__BUCKET="${GARAGE_BUCKET:-sideroom}"
          export SR_STORAGE__ACCESS_KEY="$GARAGE_ACCESS_KEY" SR_STORAGE__SECRET_KEY="$GARAGE_SECRET_KEY"
          export SR_DATABASE__URL="${DATABASE_URL:-postgres://sideroom:sideroom_dev@127.0.0.1:5432/sideroom}"
          export SR_SERVER__PUBLIC_URL=http://127.0.0.1:8080
          ./target/debug/sr-cli migrate
          SR_OWNER_PASSWORD="$SDK_COMPAT_PASSWORD" ./target/debug/sr-cli bootstrap             --owner-username "$SDK_COMPAT_OWNER" --owner-email owner@example.test || echo "the Owner exists already"
          ./target/debug/sr-server > server-voice-bot.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          timeout 60 bash -c 'until curl -fs http://127.0.0.1:8080/readyz >/dev/null; do sleep 1; done'
          cargo build -j 2 -p sr-sdk --example voice_bot
          export SR_VOICE_BOT_BIN="$PWD/target/debug/examples/voice_bot"
          node e2e/sdk-compat/voice-bot-live.mjs --seconds 60
          # RDY-DEV-001: the TypeScript bot (packages/bot, werift) joins the same kind of call with the Rust bot as
          # a partner; each must decrypt the other's frames.
          node e2e/sdk-compat/voice-bot-live.mjs --ts --seconds 60
        env:
          # Voice E2EE stays on (the default, D-249): the example answers with the MLS hello and commit loop, as
          # D-263 requires, and the driver checks that frames went out under an epoch key.
          SDK_COMPAT_BASE: http://127.0.0.1:8080
          SDK_COMPAT_OWNER: owner
          # The same dev-only Owner password as e2e/global-setup.ts: the Owner already exists in this job's database.
          SDK_COMPAT_PASSWORD: e2e-owner-Passw0rd!
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-live
          path: |
            e2e/playwright-report
            e2e/test-results
            server.log
            server-live.log
            server-voice-bot.log
            server-e2ee-chromium.log
            server-e2ee-firefox.log
            server-relay.log
            server-cinema.log
            server-library.log
            worker-cinema.log
            coturn-relay.log
            e2e/playwright-report-e2ee-firefox
            e2e/test-results-e2ee-firefox

  # L-20, D-275 (P16-E2E-1): generates the linux Chromium baselines for e2e/tests/visual.spec.ts. Manual only; it never
  # commits or pushes (contents: read). A human downloads the artifact and commits it. The report-only "visual" job
  # (L-21) lands after the first set is committed.
  # L-21 (D-275): visual regression against the committed linux baselines. Report-only until it has
  # passed on main for two weeks / 20 runs (L-22); no retries, so a flaky diff shows as one.
  visual:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-stack
      - name: Install the browser
        run: pnpm --filter @sideroom/e2e exec playwright install --with-deps chromium
      - name: Visual specs
        run: |
          ./target/debug/sr-cli migrate
          ./deploy/compose/e2e-run.sh --project=chromium tests/visual.spec.ts --retries=0
        env:
          CI: "true"
          SR_E2E_VISUAL: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-visual
          path: |
            e2e/playwright-report
            e2e/test-results
            server.log
          if-no-files-found: ignore

  visual-baselines:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-stack
      - name: Install the browser
        run: pnpm --filter @sideroom/e2e exec playwright install --with-deps chromium
      - name: Generate the baselines
        run: |
          ./target/debug/sr-cli migrate
          ./deploy/compose/e2e-run.sh --project=chromium tests/visual.spec.ts --update-snapshots
        env:
          CI: "true"
          SR_E2E_VISUAL: "1"
      - name: Job summary
        if: always()
        run: |
          dir=e2e/tests/visual.spec.ts-snapshots
          count=$(ls "$dir"/*-chromium-linux.png 2>/dev/null | wc -l)
          {
            echo "## Visual baselines (linux, Chromium)"
            echo
            echo "Generated $count baseline PNG(s). Nothing was committed or pushed."
            echo
            echo "1. Download the visual-baselines-linux artifact from this run and unzip it into $dir/."
            echo "2. Commit the *-chromium-linux.png files on a branch and open a PR."
            echo "3. Refresh them in the same PR as a Playwright or Chromium bump or an intended change to a captured page."
            echo
            ls -1 "$dir"/*-chromium-linux.png 2>/dev/null | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-linux
          path: e2e/tests/visual.spec.ts-snapshots/*-chromium-linux.png
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-baselines-report
          path: |
            e2e/playwright-report
            e2e/test-results
            server.log
