name: Voice soak

# RDY-VOX-002: N Chromium contexts in one E2EE voice channel for D minutes, each muting, unmuting, turning the
# camera on and off and reconnecting once (e2e/tests/voice-soak.spec.ts). Dispatch only: it competes for CPU and
# its pass criterion is "no failure", not latency. The defaults are the wave-22 gate (ten members, ten minutes);
# the phase 2 gate (ten people, two hours) is this workflow with minutes=120. Nothing here pushes or commits.
on:
  workflow_dispatch:
    inputs:
      count:
        description: Chromium contexts (members) in the voice channel
        default: "10"
        type: string
      minutes:
        description: How long the soak runs after everyone has joined (minutes, may be fractional)
        default: "10"
        type: string
      max_drop_ratio:
        description: Largest tolerated share of dropped E2EE frames per member (0.02 = 2 percent)
        default: "0.02"
        type: string
      camera:
        description: Turn each member's camera on and off once (the first thing to drop if the runner struggles)
        default: true
        type: boolean

concurrency:
  group: voice-soak-${{ github.ref }}
  cancel-in-progress: false

env:
  DATABASE_URL: postgres://sideroom:sideroom_dev@127.0.0.1:5432/sideroom
  SR_DATABASE__URL: postgres://sideroom:sideroom_dev@127.0.0.1:5432/sideroom
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  soak:
    # Owner (2026-10-24): the standard runner, no larger one. If it struggles, dispatch with camera=false first.
    runs-on: ubuntu-latest
    # Workflow expressions have no arithmetic, so the timeout is fixed: room for the two-hour phase 2 gate plus setup.
    timeout-minutes: 200
    env:
      SR_VOICE__ENABLED: "true"
      # Voice E2EE is on by default (D-249); stated here so the soak never silently runs in the clear.
      SR_VOICE__E2EE: "true"
      SR_ADMIN_REQUIRE_REAUTH: "0"
      SR_E2E_VOICE: "1"
      SR_E2E_SOAK: "1"
      SOAK_COUNT: ${{ inputs.count }}
      SOAK_MINUTES: ${{ inputs.minutes }}
      SOAK_MAX_DROP_RATIO: ${{ inputs.max_drop_ratio }}
      SOAK_CAMERA: ${{ inputs.camera && '1' || '0' }}
      # The target is right (the embedded SFU logs as sr_voice::server / sr_voice::core). Run 40226525398 showed
      # no sr_voice lines only because the SFU logged nothing on joins, resumes or drops; it now does (debug), and
      # a participant whose drop clears its voice state is logged at info ("voice participant lost"). The
      # gateway and /voice/ws upgrades bypass the tower_http trace layer, so they never appear as requests.
      SR_LOG__FILTER: "info,sr_voice=debug"
      # Environment allowance (RDY-VOX-002, run 40229221042): the e2e stack builds sr-server in the dev profile,
      # and an unoptimised SFU (str0m, SRTP) costs far more CPU than a deployed (release) one: in the local load
      # harness, nine audio-only talkers took 40-75 % of one core in the debug build, and the runner has 4 vCPU
      # shared with ten Chromium contexts. The soak measures the SFU as operators run it, so this job optimises the dev build
      # (same ./target/debug paths; debug assertions stay on). This raises only this job's build time.
      CARGO_PROFILE_DEV_OPT_LEVEL: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/e2e-stack
      - name: Install the browser
        run: pnpm --filter @sideroom/e2e exec playwright install --with-deps chromium
      - name: Start sr-server
        run: |
          ./target/debug/sr-cli migrate
          set -a; . deploy/compose/.env.example; set +a
          export SR_SERVER__PUBLIC_URL=http://localhost:5173
          export SR_STORAGE__ENDPOINT=http://127.0.0.1:3900
          export SR_STORAGE__REGION=garage
          export SR_STORAGE__BUCKET="$GARAGE_BUCKET"
          export SR_STORAGE__ACCESS_KEY="$GARAGE_ACCESS_KEY"
          export SR_STORAGE__SECRET_KEY="$GARAGE_SECRET_KEY"
          nohup ./target/debug/sr-server > server.log 2>&1 &
          echo "$!" > sr-server.pid
          timeout 60 bash -c 'until curl -fs http://127.0.0.1:8080/readyz >/dev/null; do sleep 1; done' || {
            cat server.log
            exit 1
          }
          echo "sr-server pid $(cat sr-server.pid)"
      # Environment parity (RDY-VOX-002, run 40250340133): the pages' socket logs showed gateway heartbeats sent up
      # to 45 s late while the server never blocked a write, i.e. ten pages of the Vite dev server (React's
      # development build, unbundled modules) starved the runner's CPU. The soak runs the production build behind
      # `vite preview`, which proxies /api, /gateway and /voice like Caddy and enforces the production CSP.
      - name: Build the web app (production bundle)
        run: pnpm --filter @sideroom/web build
        env:
          VITE_SR_E2E: "1"
      - name: Soak (${{ inputs.count }} members, ${{ inputs.minutes }} minutes)
        run: pnpm --filter @sideroom/e2e exec playwright test --project=chromium tests/voice-soak.spec.ts --retries=0 --reporter=list,html
        env:
          CI: "true"
          SR_E2E_WEB: preview
      # No SFU restart: the process the soak started is still the one answering, and it did not panic.
      - name: The SFU was not restarted
        if: always()
        run: |
          pid="$(cat sr-server.pid)"
          if ! kill -0 "$pid" 2>/dev/null; then echo "sr-server (pid $pid) is gone"; exit 1; fi
          curl -fs http://127.0.0.1:8080/readyz >/dev/null
          if grep -Ei 'panicked|thread .* panicked' server.log; then echo "sr-server panicked"; exit 1; fi
          echo "sr-server pid $pid is still running, readyz ok, no panic in server.log"
      - name: Stop sr-server
        if: always()
        run: kill "$(cat sr-server.pid)" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: voice-soak
          path: |
            e2e/playwright-report
            e2e/test-results
            server.log
          if-no-files-found: ignore
