name: Production smoke
# RDY-OPS-001/002/003: the shipped production files boot on a machine nobody prepared by hand. Builds the server image and
# the web bundle as release-dry-run.yml does, then (stack) runs deploy/install.sh --yes against deploy/compose/prod.yml
# with Caddy on its internal CA, waits for /healthz through Caddy, signs in, runs the entrance-smoke spec, and drills
# backup.sh, restore.sh, wal-drill.sh, sr-cli backup / restore --force / upgrade --dry-run against the running containers.
# The systemd job runs `systemd-analyze verify` over deploy/systemd and the static-binary install of deploy/INSTALL.md as
# a user service. Manual dispatch, weekly, and on pull requests that touch the install surface (D-354: deploy/**, this
# workflow, crates/sr-cli/**, crates/sr-preflight/**). It is not a required check until it has been green on the default
# branch at least twice; then the owner adds it in branch protection (docs/dev/owner-checklist.md).
# The steps live in deploy/scripts/prod-smoke.sh and deploy/scripts/smoke-systemd.sh so they can be read and run by hand.
on:
  workflow_dispatch:
    inputs:
      systemd_user_fallback:
        description: "If the runner has no systemd user manager, run sr-server directly (the unit is then NOT proven)"
        type: boolean
        default: false
  schedule:
    - cron: "41 5 * * 2"
  # D-354. inputs.systemd_user_fallback is absent here, so SMOKE_SYSTEMD_USER_FALLBACK evaluates to 0: a PR run proves the
  # real unit or fails.
  pull_request:
    paths:
      - "deploy/**"
      - ".github/workflows/prod-smoke.yml"
      - "crates/sr-cli/**"
      - "crates/sr-preflight/**"
concurrency:
  group: prod-smoke-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  SMOKE_IMAGE: sideroom-server:smoke
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The same build as release-dry-run.yml's server-image job (shares its layer cache), kept as a tarball.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/server.Dockerfile
          platforms: linux/amd64
          tags: ${{ env.SMOKE_IMAGE }}
          outputs: type=docker,dest=${{ runner.temp }}/server-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-server-image
          path: ${{ runner.temp }}/server-image.tar
          retention-days: 1

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: "wasm-pack" }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sideroom/wasm build
      - run: pnpm --filter @sideroom/web build
      - run: tar -C apps/web -czf "$RUNNER_TEMP/web-dist.tar.gz" dist
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-web-dist
          path: ${{ runner.temp }}/web-dist.tar.gz
          retention-days: 1

  stack:
    needs: [image, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: smoke-server-image, path: "${{ runner.temp }}/in" }
      - uses: actions/download-artifact@v4
        with: { name: smoke-web-dist, path: "${{ runner.temp }}/in" }
      - name: Load the image, unpack the web bundle, take the static binaries out of the image
        run: |
          docker load -i "$RUNNER_TEMP/in/server-image.tar"
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/in/web-dist.tar.gz"
          echo "SMOKE_WEB_DIR=$RUNNER_TEMP/dist" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/bin"
          id=$(docker create "$SMOKE_IMAGE")
          docker cp "$id:/usr/local/bin/sr-cli" "$RUNNER_TEMP/bin/sr-cli"
          docker rm "$id" >/dev/null
          chmod +x "$RUNNER_TEMP/bin/sr-cli"
          echo "SMOKE_CLI_BIN=$RUNNER_TEMP/bin/sr-cli" >> "$GITHUB_ENV"
      # pg_dump refuses to dump a newer server, and the runner ships the 16 client: same fix as backup-drill.yml.
      - name: Install the PostgreSQL 17 client tools (sr-cli backup and restore run on the host)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @sideroom/e2e...
      - name: Install (deploy/install.sh --yes against prod.yml, https://smoke.localhost)
        run: deploy/scripts/prod-smoke.sh install
      - name: Healthz through Caddy
        run: deploy/scripts/prod-smoke.sh wait
      - name: Migrate again, bootstrap again
        run: deploy/scripts/prod-smoke.sh migrate
      - name: Sign in through Caddy, read Admin > System
        run: deploy/scripts/prod-smoke.sh signin
      # RDY-OPS-004: install.sh already printed the table from its one-off container; this run is from the host,
      # where smoke.localhost reaches Caddy, and it fails on any row the smoke stack should pass.
      - name: sr-cli preflight --insecure-tls against the running stack
        run: deploy/scripts/prod-smoke.sh preflight
      - name: Playwright entrance-smoke, noindex (OPS-IDX-001) and entrance-isolation (SEC-ENT-004) through Caddy
        run: |
          pnpm --filter @sideroom/e2e exec playwright install --with-deps chromium
          # Same specs and settings as playwright.config.ts, but against the running stack: no dev server, no
          # global setup (the stack is already migrated and bootstrapped), Chromium only, and Caddy's internal CA
          # is not in the browser's trust store.
          cat > e2e/playwright.prod-smoke.config.ts <<'EOF'
          import { defineConfig } from '@playwright/test';
          import base from './playwright.config';
          export default defineConfig({
            ...base,
            globalSetup: undefined,
            webServer: undefined,
            retries: 0,
            reporter: [['list']],
            projects: [base.projects![0]],
            use: { ...base.use, baseURL: 'https://smoke.localhost', ignoreHTTPSErrors: true },
          });
          EOF
          # SR_E2E_ISOLATION=1 turns on entrance-isolation.spec.ts: the same anonymous, gate and signed-in checks as the
          # e2e job, here through the installed Caddy and the server container (D-385). The runner cannot reach the stack's
          # database, so the signed-in cases use the Owner whose password install left in $SMOKE_WORK.
          export SR_E2E_BASE_URL=https://smoke.localhost
          export SR_E2E_OWNER_PASSWORD_FILE="${RUNNER_TEMP}/sr-prod-smoke/owner-password"
          SR_E2E_NOINDEX=1 SR_E2E_ISOLATION=1 pnpm --filter @sideroom/e2e exec playwright test --config playwright.prod-smoke.config.ts entrance-smoke noindex entrance-isolation
      - name: Backup, restore and WAL drills against the running stack
        run: deploy/scripts/prod-smoke.sh backups
      - name: sr-cli backup, restore --force and upgrade --dry-run
        run: deploy/scripts/prod-smoke.sh cli-backups
      - name: Container state and logs
        if: failure()
        run: deploy/scripts/prod-smoke.sh logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: prod-smoke-playwright
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 3

  systemd:
    needs: [image, web]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: sideroom
          POSTGRES_PASSWORD: sideroom_ci
          POSTGRES_DB: sideroom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sideroom" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: smoke-server-image, path: "${{ runner.temp }}/in" }
      - uses: actions/download-artifact@v4
        with: { name: smoke-web-dist, path: "${{ runner.temp }}/in" }
      - name: Take the static binaries out of the image, unpack the web build
        run: |
          docker load -i "$RUNNER_TEMP/in/server-image.tar"
          # The unit sets SR_WEB__ROOT=/opt/sideroom/web; the smoke installs this build there (D-385).
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/in/web-dist.tar.gz"
          echo "SMOKE_WEB_DIR=$RUNNER_TEMP/dist" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/bin"
          id=$(docker create "$SMOKE_IMAGE")
          docker cp "$id:/usr/local/bin/sr-server" "$RUNNER_TEMP/bin/sr-server"
          docker cp "$id:/usr/local/bin/sr-cli" "$RUNNER_TEMP/bin/sr-cli"
          docker rm "$id" >/dev/null
          chmod +x "$RUNNER_TEMP/bin/sr-server" "$RUNNER_TEMP/bin/sr-cli"
          echo "SMOKE_SERVER_BIN=$RUNNER_TEMP/bin/sr-server" >> "$GITHUB_ENV"
          echo "SMOKE_CLI_BIN=$RUNNER_TEMP/bin/sr-cli" >> "$GITHUB_ENV"
      - name: systemd-analyze verify over deploy/systemd
        run: deploy/scripts/smoke-systemd.sh verify
      - name: Static-binary install, started as a systemd user service
        env:
          SMOKE_DATABASE_URL: postgres://sideroom:sideroom_ci@127.0.0.1:5432/sideroom?sslmode=disable
          SMOKE_SYSTEMD_USER_FALLBACK: ${{ inputs.systemd_user_fallback && '1' || '0' }}
        run: deploy/scripts/smoke-systemd.sh user-service

  # RDY-OBS-001: the alert rules parse and type-check. Standalone (no `needs`), so it runs alongside the jobs above.
  # Downloads one pinned Prometheus release on the runner (owner-approved in wave 24, CI only) and runs promtool.
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROM_VERSION: "3.5.0"
      # sha256 of prometheus-3.5.0.linux-amd64.tar.gz, from the release's sha256sums.txt and the GitHub asset digest
      # (both agree). Bump both lines together.
      PROM_SHA256: "e811827af26d822afb09a4f28314f61b618b12cff5369835a67f674d8b46f39a"
    steps:
      - uses: actions/checkout@v4
      - name: Download promtool (pinned Prometheus release, sha256 checked)
        run: |
          set -euo pipefail
          name="prometheus-${PROM_VERSION}.linux-amd64"
          base="https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/${name}.tar.gz"
          echo "${PROM_SHA256}  ${name}.tar.gz" | sha256sum -c -
          tar -xzf "${name}.tar.gz" "${name}/promtool"
          echo "$RUNNER_TEMP/${name}" >> "$GITHUB_PATH"
      - name: promtool check rules
        run: |
          promtool --version
          promtool check rules deploy/monitoring/alerts.yml

  # RDY-OPS-007: the upgrade drill. The previous release (the merge base of the change with its target branch; the commit
  # before it when there is none, as on a push to main) is built into an image here, in parallel with `image`, because
  # nothing about that build is cached across commits and it must not eat the drill's 25 minutes. The `upgrade` job then
  # installs it with ITS OWN deploy files, seeds it, backs up as deploy/UPGRADE.md says, upgrades to this checkout's image
  # and files, and rolls back from the backup, checking sign-in and the seeded data after each move
  # (deploy/scripts/prod-smoke.sh upgrade-*, deploy/scripts/upgrade-check.mjs). The web bundle is this checkout's for
  # both versions: the drill is about the server, the database and the deploy files.
  upgrade-base:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      sha: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: base
        name: Find the previous release
        run: |
          deploy/scripts/prod-smoke.sh base-sha > "$RUNNER_TEMP/base-sha"
          echo "sha=$(cat "$RUNNER_TEMP/base-sha")" >> "$GITHUB_OUTPUT"
          echo "previous release: $(git log -1 --format='%h %s' "$(cat "$RUNNER_TEMP/base-sha")")"
      - name: Check out the previous release beside this one
        run: git worktree add --detach "$RUNNER_TEMP/previous" "$(cat "$RUNNER_TEMP/base-sha")"
      - uses: docker/setup-buildx-action@v3
      # Same Dockerfile as `image`, the previous release's own copy of it. Reads the layer cache, never writes it.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ runner.temp }}/previous
          file: ${{ runner.temp }}/previous/deploy/docker/server.Dockerfile
          platforms: linux/amd64
          tags: sideroom-server:previous
          outputs: type=docker,dest=${{ runner.temp }}/previous-image.tar
          cache-from: type=gha
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-previous-image
          path: ${{ runner.temp }}/previous-image.tar
          retention-days: 1

  upgrade:
    needs: [image, web, upgrade-base]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SMOKE_PREV_IMAGE: sideroom-server:previous
      SMOKE_BASE_SHA: ${{ needs.upgrade-base.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/download-artifact@v4
        with: { name: smoke-server-image, path: "${{ runner.temp }}/in" }
      - uses: actions/download-artifact@v4
        with: { name: smoke-previous-image, path: "${{ runner.temp }}/in" }
      - uses: actions/download-artifact@v4
        with: { name: smoke-web-dist, path: "${{ runner.temp }}/in" }
      - name: Load both images and unpack the web bundle
        run: |
          docker load -i "$RUNNER_TEMP/in/server-image.tar"
          docker load -i "$RUNNER_TEMP/in/previous-image.tar"
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/in/web-dist.tar.gz"
          {
            echo "SMOKE_WEB_DIR=$RUNNER_TEMP/dist"
            echo "SMOKE_WORK=$RUNNER_TEMP/sr-prod-smoke"
            echo "SMOKE_DEPLOY_DIR=$RUNNER_TEMP/sr-prod-smoke/live/deploy"
          } >> "$GITHUB_ENV"
          echo "previous release $SMOKE_BASE_SHA, this change $(git rev-parse HEAD)"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @sideroom/e2e...
      - name: Install the previous release (its own deploy/install.sh --yes)
        run: |
          deploy/scripts/prod-smoke.sh upgrade-prepare
          deploy/scripts/prod-smoke.sh upgrade-install
      - name: Healthz through Caddy (previous release)
        run: deploy/scripts/prod-smoke.sh wait
      - name: Seed the previous release (sr-cli seed, a Cinema title, a marker message)
        run: deploy/scripts/prod-smoke.sh upgrade-seed
      - name: The seeded data reads back (so a later failure is the upgrade, not the check)
        run: deploy/scripts/prod-smoke.sh upgrade-verify before
      - name: Back up as UPGRADE.md says
        run: deploy/scripts/prod-smoke.sh upgrade-backup
      - name: Upgrade to this change (UPGRADE.md steps 3 to 7)
        run: deploy/scripts/prod-smoke.sh upgrade-apply
      - name: Healthz through Caddy (after the upgrade)
        run: deploy/scripts/prod-smoke.sh wait
      - name: Sign-in and the seeded data after the upgrade
        run: deploy/scripts/prod-smoke.sh upgrade-verify after-upgrade
      # The same config as the stack job's entrance-smoke step, against the running stack.
      - name: Playwright entrance-smoke through Caddy (after the upgrade)
        run: |
          pnpm --filter @sideroom/e2e exec playwright install --with-deps chromium
          cat > e2e/playwright.prod-smoke.config.ts <<'EOF'
          import { defineConfig } from '@playwright/test';
          import base from './playwright.config';
          export default defineConfig({
            ...base,
            globalSetup: undefined,
            webServer: undefined,
            retries: 0,
            reporter: [['list']],
            projects: [base.projects![0]],
            use: { ...base.use, baseURL: 'https://smoke.localhost', ignoreHTTPSErrors: true },
          });
          EOF
          pnpm --filter @sideroom/e2e exec playwright test --config playwright.prod-smoke.config.ts entrance-smoke
      - name: Roll back from the backup (UPGRADE.md "Rolling back")
        run: deploy/scripts/prod-smoke.sh upgrade-rollback
      - name: Healthz through Caddy (after the rollback)
        run: deploy/scripts/prod-smoke.sh wait
      - name: Sign-in and the seeded data after the rollback
        run: deploy/scripts/prod-smoke.sh upgrade-verify after-rollback
      # After the rollback the server and the Caddyfile are the previous release's, but the web bundle stays this
      # checkout's (the drill is about the server, the database and the deploy files; see the upgrade-base comment).
      # Since D-385 the path routing lives in that pairing (the gate's 302, one shell per surface), so neither this
      # change's routing cases (/register, /board) nor the previous release's can hold on the mixed stack. The
      # landing-page cases do; the routing is proven after the upgrade above and in the stack job.
      - name: Playwright entrance-smoke through Caddy (after the rollback, the landing-page cases)
        run: >-
          pnpm --filter @sideroom/e2e exec playwright test --config playwright.prod-smoke.config.ts entrance-smoke
          --grep "landing renders|unknown invite|closed door"
      - name: Container state and logs
        if: failure()
        run: deploy/scripts/prod-smoke.sh logs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: prod-smoke-upgrade-playwright
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 3
