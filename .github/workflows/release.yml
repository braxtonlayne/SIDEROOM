name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
jobs:
  binaries:
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo install cross --locked
      - run: cross build --release --target ${{ matrix.target }} -p sr-server -p sr-voice -p sr-transcoder -p sr-cli
      - name: Package
        run: |
          d=dist/${{ matrix.target }}
          mkdir -p "$d"
          for b in sr-server sr-voice sr-transcoder sr-cli; do
            cp "target/${{ matrix.target }}/release/$b" "$d/"
          done
          tar -C dist -czf "sideroom-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: sideroom-*.tar.gz

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { image: sideroom-server, file: deploy/docker/server.Dockerfile, suffix: "" }
          - { image: sideroom-voice, file: deploy/docker/voice.Dockerfile, suffix: "" }
          - { image: sideroom-transcoder, file: deploy/docker/transcoder.Dockerfile, suffix: "-cuda" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}${{ matrix.suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [binaries, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: release
      - name: Checksums
        run: cd release && sha256sum *.tar.gz > SHA256SUMS
      - name: Changelog from commits since previous tag
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then range="$prev..$GITHUB_REF_NAME"; else range="$GITHUB_REF_NAME"; fi
          git log --pretty='- %s (%h)' "$range" > CHANGELOG.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: release/*
