name: Release
on:
  push:
    tags: ["v*"]
# SEC-AUD-031: read-only by default; only the job that needs a write permission gets it.
permissions:
  contents: read
jobs:
  binaries:
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ziglang==0.13.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: cargo zigbuild --release --target ${{ matrix.target }} -p sr-server -p sr-voice -p sr-transcoder -p sr-cli
      - name: Package
        run: |
          d=dist/${{ matrix.target }}
          mkdir -p "$d"
          for b in sr-server sr-voice sr-transcoder sr-cli; do
            cp "target/${{ matrix.target }}/release/$b" "$d/"
          done
          tar -C dist -czf "sideroom-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: sideroom-*.tar.gz

  # SEC-AUD-196 (D-668): the web app is part of the release, so an operator who installs binaries needs no Node, pnpm or
  # wasm toolchain. Built exactly as web.yml builds it, with the same three build checks, and packed with the
  # top-level directory `web/`; the Checksums step of `publish` covers it with the binaries.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: wasm-pack }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sideroom/wasm build
      - run: pnpm --filter @sideroom/web build
      - name: Bundle budget
        run: node scripts/check-bundle-budget.mjs
      - name: Entrance isolation
        run: node scripts/check-entrance-isolation.mjs
      - name: Staff delivery
        run: node scripts/check-staff-delivery.mjs
      - name: Package
        run: |
          mkdir -p stage
          cp -r apps/web/dist stage/web
          tar -C stage -czf "sideroom-${{ github.ref_name }}-web.tar.gz" web
      - uses: actions/upload-artifact@v4
        with:
          name: bin-web
          path: sideroom-*-web.tar.gz

  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { image: sideroom-server, file: deploy/docker/server.Dockerfile, suffix: "", platforms: "linux/amd64,linux/arm64" }
          - { image: sideroom-voice, file: deploy/docker/voice.Dockerfile, suffix: "", platforms: "linux/amd64" }
          - { image: sideroom-transcoder, file: deploy/docker/transcoder.Dockerfile, suffix: "-cuda", platforms: "linux/amd64" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}${{ matrix.suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [binaries, web, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: release
      - name: Checksums
        run: cd release && sha256sum *.tar.gz > SHA256SUMS
      - name: Changelog from commits since previous tag
        run: |
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then range="$prev..$GITHUB_REF_NAME"; else range="$GITHUB_REF_NAME"; fi
          git log --pretty='- %s (%h)' "$range" > CHANGELOG.md
      # SEC-AUD-031: the release is made with the runner's own GitHub CLI, not a third-party action on a mutable
      # tag running with `contents: write`. A re-run replaces the assets of the release the first run made.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag
          fi
