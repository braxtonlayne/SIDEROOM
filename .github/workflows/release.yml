name: Release
on:
  push:
    tags: ["v*"]
# SEC-AUD-031: read-only by default; only the job that needs a write permission gets it.
permissions:
  contents: read
jobs:
  binaries:
    strategy:
      matrix:
        target: [x86_64-unknown-linux-musl, aarch64-unknown-linux-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ziglang==0.13.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: cargo zigbuild --locked --release --target ${{ matrix.target }} -p sr-server -p sr-voice -p sr-transcoder -p sr-cli
      - name: Package
        run: |
          d=dist/${{ matrix.target }}
          mkdir -p "$d"
          for b in sr-server sr-voice sr-transcoder sr-cli; do
            cp "target/${{ matrix.target }}/release/$b" "$d/"
          done
          tar -C dist -czf "sideroom-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: sideroom-*.tar.gz

  # SEC-AUD-196 (D-668): the web app is part of the release, so an operator who installs binaries needs no Node, pnpm or
  # wasm toolchain. Built exactly as web.yml builds it, with the same three build checks, and packed with the
  # top-level directory `web/`; the Checksums step of `publish` covers it with the binaries.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: wasm-pack }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sideroom/wasm build
      - run: pnpm --filter @sideroom/web build
      - name: Bundle budget
        run: node scripts/check-bundle-budget.mjs
      - name: Entrance isolation
        run: node scripts/check-entrance-isolation.mjs
      - name: Staff delivery
        run: node scripts/check-staff-delivery.mjs
      # SEC-AUD-211: the same script the dry run calls (release-dry-run.yml, `web-bundle`): it refuses an e2e build, an
      # unstamped service worker and a dist that lacks a file, packs the directory as `web/` and lists the archive.
      - name: Package
        run: node scripts/pack-web-release.mjs apps/web/dist "sideroom-${{ github.ref_name }}-web.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-web
          path: sideroom-*-web.tar.gz

  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { image: sideroom-server, file: deploy/docker/server.Dockerfile, suffix: "", platforms: "linux/amd64,linux/arm64" }
          - { image: sideroom-voice, file: deploy/docker/voice.Dockerfile, suffix: "", platforms: "linux/amd64" }
          - { image: sideroom-transcoder, file: deploy/docker/transcoder.Dockerfile, suffix: "-cuda", platforms: "linux/amd64" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:${{ github.ref_name }}${{ matrix.suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [binaries, web, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: release
      - name: Checksums
        run: cd release && sha256sum *.tar.gz > SHA256SUMS
      # SEC-AUD-561 (D-1043): the notes are at most 100 000 characters (GitHub refuses a longer body, and then no release
      # page is made although the images are pushed) and start at the previous `v*` tag, never at another kind of tag.
      # The first release has no earlier `v*` tag: its notes are the top section of CHANGELOG.md, not the whole history.
      # This step cannot fail: every command that could is guarded, and an empty result becomes a one-line body.
      - name: Release notes from the previous v tag
        run: |
          tag="$GITHUB_REF_NAME"
          # The previous release tag, `v*` only (a tag of another kind, such as p27-day1, is never a range start).
          prev=$(git describe --tags --abbrev=0 --match 'v*' "${tag}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            # A later release: the commit subjects since the previous release.
            git log --pretty='- %s (%h)' "$prev..$tag" > notes.full || true
          else
            # The first release: the top section of CHANGELOG.md (from its first `## ` heading to the next one).
            awk '/^## /{n++} n==1' CHANGELOG.md > notes.full || true
            echo "" >> notes.full
            echo "Full history: the commit log of this tag." >> notes.full
          fi
          # The cap: whole lines only, 99 900 characters at most, then the line that says so (100 000 in all).
          awk -v max=99900 '{ n += length($0) + 1; if (n > max) { cut = 1; exit } print } END { if (cut) print "(notes cut at 100 000 characters)" }' notes.full > notes.capped || true
          # Nothing at all (an empty range, a failed command): one line, so the release page is still made.
          if [ ! -s notes.capped ]; then echo "Release $tag." > notes.capped; fi
          mv notes.capped CHANGELOG.md
          rm -f notes.full
          echo "release notes: $(wc -m < CHANGELOG.md) characters"
      # SEC-AUD-031: the release is made with the runner's own GitHub CLI, not a third-party action on a mutable
      # tag running with `contents: write`. A re-run replaces the assets of the release the first run made.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag
          fi
