name: E2E stack
description: >-
  Toolchains, Postgres and Garage, sr-server and sr-cli, pnpm dependencies and the WASM bundle that every
  e2e job needs. The caller installs its own browsers and runs the specs.
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with: { targets: wasm32-unknown-unknown }
    - uses: Swatinem/rust-cache@v2
    - uses: taiki-e/install-action@v2
      with: { tool: "wasm-pack" }
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - name: Start Postgres and Garage
      shell: bash
      run: |
        docker compose -f deploy/compose/dev.yml up -d --wait postgres
        docker compose -f deploy/compose/dev.yml up -d garage
        ./deploy/compose/garage/bootstrap.sh
    - name: Build sr-server and sr-cli
      shell: bash
      run: cargo build -p sr-server -p sr-cli
    # D-175: the page PUTs uploads straight to the bucket, so the bucket needs a CORS rule for the origin the
    # specs load the app from (Vite, :5173). bootstrap.sh runs before sr-cli is built and only names the dev
    # origins, so it printed "sr-cli not found" and set no rule: on f1e89b77 the composer's part PUT reached
    # Garage (Playwright answers the preflight of a routed request itself), but the browser refused the answer,
    # so the part never counted as sent ("ledger= s3=1").
    - name: Bucket CORS for the browser
      shell: bash
      run: |
        set -a; . deploy/compose/.env.example; set +a
        SR_STORAGE__ENDPOINT=http://127.0.0.1:3900 SR_STORAGE__REGION=garage SR_STORAGE__BUCKET="$GARAGE_BUCKET" \
          SR_STORAGE__ACCESS_KEY="$GARAGE_ACCESS_KEY" SR_STORAGE__SECRET_KEY="$GARAGE_SECRET_KEY" \
          ./target/debug/sr-cli storage ensure-cors \
          --origin http://localhost:5173 --origin http://localhost:8080 --origin http://localhost:8088
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    # The Lounge imports the WASM bundle from @sideroom/wasm (packages/wasm/dist); without it Vite
    # fails with 'Failed to resolve import ../dist/...' and its error overlay blocks every click.
    - name: Build the WASM bundle
      shell: bash
      run: pnpm --filter @sideroom/wasm build
