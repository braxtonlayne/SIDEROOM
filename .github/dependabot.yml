version: 2
# Update PRs must pass the PR title lint (scripts/check-pr-title.mjs): the `chore(deps)` prefix does that.
# scripts/check-dependabot.mjs verifies the directories below exist and every block has a prefix.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: "ci(deps)" }
  - package-ecosystem: docker
    directory: /deploy/compose
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
  # The service Dockerfiles pin their base images too.
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule: { interval: weekly }
    commit-message: { prefix: "chore(deps)" }
