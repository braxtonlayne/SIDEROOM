# SIDE ROOM production stack (XC-OPS-001). One host, one operator. See deploy/INSTALL.md and docs/12.
#
#   cp deploy/compose/.env.prod.example deploy/compose/.env.prod   # then edit every CHANGE_ME
#   docker compose -f deploy/compose/prod.yml --env-file deploy/compose/.env.prod up -d
#   docker compose -f deploy/compose/prod.yml --env-file deploy/compose/.env.prod --profile monitoring up -d
#
# Status: no Docker on the build machines, so the stack is checked statically instead: crates/sr-core/tests/deploy_files.rs
# feeds this file's server environment through the real config loader and cross-checks the services, volumes, env
# file, Caddyfile and systemd units. The first install on a clean host is still the final test; report what breaks.
name: sideroom

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:17
    environment:
      POSTGRES_USER: sideroom
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: sideroom
    # Continuous WAL archiving for point-in-time recovery (XC-OPS-003, deploy/BACKUP.md). Finished WAL segments
    # go to the wal-archive volume; deploy/scripts/basebackup.sh provides the starting points.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_timeout=300
      - -c
      - archive_command=sh /opt/sideroom/scripts/wal-archive.sh /var/lib/postgresql/wal-archive %p %f
    volumes:
      - pgdata:/var/lib/postgresql/data
      - wal-archive:/var/lib/postgresql/wal-archive
      - pg-backups:/var/backups/sideroom
      - ../scripts:/opt/sideroom/scripts:ro
    depends_on:
      wal-archive-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sideroom -d sideroom"]
      interval: 10s
      timeout: 3s
      retries: 10
    # No published port: only the compose network (and docker exec for backups) reaches Postgres.

  # The named volumes are created root-owned; the postgres user (uid 999) must be able to write to them.
  # The backup folder is 750 rather than 700 so sr-server, which is in group 999 (see group_add below), can list it
  # read-only and Admin > System can show the last backup time (RDY-OPS-002). The WAL archive stays 700.
  wal-archive-init:
    image: postgres:17
    user: root
    command: ["sh", "-c", "chown postgres:postgres /var/lib/postgresql/wal-archive /var/backups/sideroom && chmod 700 /var/lib/postgresql/wal-archive && chmod 750 /var/backups/sideroom"]
    volumes:
      - wal-archive:/var/lib/postgresql/wal-archive
      - pg-backups:/var/backups/sideroom

  garage:
    <<: *restart
    image: dxflrs/garage:v1.0.1
    volumes:
      - ./garage/garage.prod.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    # Layout, key and bucket: run deploy/compose/garage/bootstrap.sh once (see INSTALL.md section 5).

  sr-server:
    <<: *restart
    image: ${SR_IMAGE:?set SR_IMAGE in .env.prod}
    depends_on:
      postgres: { condition: service_healthy }
      garage: { condition: service_started }
    environment:
      SR_SERVER__BIND: 0.0.0.0:8080
      SR_SERVER__PUBLIC_URL: https://${SR_DOMAIN:?set SR_DOMAIN in .env.prod}
      SR_SERVER__SECRET_KEY: ${SR_SECRET_KEY:?set SR_SECRET_KEY (64 hex chars)}
      SR_SERVER__TRUST_FORWARDED_FOR: "true" # Caddy is the only thing that can reach this port
      # Reachable by Prometheus on the compose network only; it is not published and Caddy 404s /internal/*.
      SR_SERVER__METRICS_BIND: 0.0.0.0:9100
      SR_DATABASE__URL: postgres://sideroom:${POSTGRES_PASSWORD}@postgres:5432/sideroom?sslmode=disable
      SR_STORAGE__ENDPOINT: http://garage:3900
      SR_STORAGE__REGION: garage
      SR_STORAGE__BUCKET: ${GARAGE_BUCKET:-sideroom}
      SR_STORAGE__ACCESS_KEY: ${GARAGE_ACCESS_KEY:?set GARAGE_ACCESS_KEY}
      SR_STORAGE__SECRET_KEY: ${GARAGE_SECRET_KEY:?set GARAGE_SECRET_KEY}
      SR_SMTP__HOST: ${SMTP_HOST:?set SMTP_HOST}
      SR_SMTP__PORT: ${SMTP_PORT:-587}
      SR_SMTP__TLS: ${SMTP_TLS:-starttls}
      SR_SMTP__FROM: ${SMTP_FROM:?set SMTP_FROM}
      SR_SMTP__USERNAME: ${SMTP_USERNAME:-}
      SR_SMTP__PASSWORD: ${SMTP_PASSWORD:-}
      # Local folders a staff member may point an ingest source at (REV-UP-005). Empty = local folders off.
      SR_INGEST__ROOTS: ${SR_INGEST_ROOTS:-}
      # Donations (D-288, M-02). The price sources are on by default; the Esplora endpoint is empty (donations off) until
      # the `payments` profile is on and electrs has synced, or until you set the interim https://mempool.space/api.
      # These are read from the process environment by sr-server (payments_jobs.rs), not by the config loader.
      SR_PAYMENTS_ESPLORA_URL: ${SR_PAYMENTS_ESPLORA_URL:-}
      SR_PAYMENTS_RATE_SOURCES: ${SR_PAYMENTS_RATE_SOURCES:-}
      # Needed when the endpoint is the private electrs container (the SSRF client refuses private addresses); the
      # preflight Esplora row fails on a private electrs address until this is 1 (D-358).
      SR_PAYMENTS_ALLOW_PRIVATE_HOSTS: ${SR_PAYMENTS_ALLOW_PRIVATE_HOSTS:-}
      # The built web app, mounted read-only below: sr-server serves /app and /app/* from it to a signed-in session only
      # (D-385). It refuses to start when this is set and app/csp.txt is missing. Caddy serves the public files only.
      SR_WEB__ROOT: /srv/web
    # Group 999 is the postgres group of the postgres:17 image: it lets the server read the backup folder below.
    group_add: ["999"]
    volumes:
      # Optional, read-only: the folder named above. The ledger never moves or deletes files here.
      - ${SR_INGEST_DIR:-/srv/sideroom/ingest}:/srv/sideroom/ingest:ro
      # Read-only view of the backups the postgres container writes (backup.sh, basebackup.sh). Set the platform
      # setting ops.backup_dir to /var/backups/sideroom and Admin > System shows the last backup (deploy/BACKUP.md).
      - pg-backups:/var/backups/sideroom:ro
      # The same dist Caddy serves its public files from (SEC-ENT-003).
      - ${SR_WEB_DIR:?set SR_WEB_DIR to the built apps/web/dist}:/srv/web:ro
    stop_grace_period: 60s # server drains for 2 x shutdown_grace_secs (docs/dev/server.md)
    healthcheck:
      # The distroless image has no shell or curl; the binary probes its own /readyz (database and storage).
      test: ["CMD", "/usr/local/bin/sr-server", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 90s # migrations and the search index can take a while on first boot

  caddy:
    <<: *restart
    image: caddy:2
    depends_on:
      sr-server: { condition: service_started }
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      SR_DOMAIN: ${SR_DOMAIN}
      SR_UPSTREAM: sr-server:8080
      SR_WEB_ROOT: /srv/web
    volumes:
      - ./caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - ${SR_WEB_DIR:?set SR_WEB_DIR to the built apps/web/dist}:/srv/web:ro
      - caddy-data:/data
      - caddy-config:/config

  # --- profile: payments (D-288, M-02) ---------------------------------------------------------------
  # A self-hosted Esplora-compatible electrs, so the invoice addresses this server derives never leave the box.
  # OFF by default: `--profile payments up -d`, then set in .env.prod
  #   SR_PAYMENTS_ESPLORA_URL=http://electrs:3000   and   SR_PAYMENTS_ALLOW_PRIVATE_HOSTS=1
  # Cost: electrs needs a fully synced, non-pruned bitcoind (about 700 GB today) and builds its own index (about
  # 50 GB more); the first sync takes days. bitcoind is NOT part of this stack: point SR_ELECTRS_DAEMON_RPC_ADDR at
  # yours and mount its data directory through SR_BITCOIND_DIR (cookie auth). No port is published: only services
  # on the compose network, that is sr-server, can reach it. Until it has synced, use the documented interim
  # https://mempool.space/api (it learns which addresses this server watches).
  # IMAGE PLACEHOLDER: no digest was available offline. Before the first start, pull the Esplora-REST electrs build you
  # trust (Blockstream's electrs fork serves the REST API on port 3000), then replace the tag below with
  # `@sha256:<digest>` and confirm the flags against that image's --help.
  electrs:
    <<: *restart
    profiles: [payments]
    image: blockstream/electrs:PIN-BY-DIGEST-BEFORE-FIRST-START
    command:
      - electrs
      - --network=mainnet
      - --daemon-rpc-addr=${SR_ELECTRS_DAEMON_RPC_ADDR:-host.docker.internal:8332}
      - --daemon-dir=/bitcoin
      - --db-dir=/data
      - --http-addr=0.0.0.0:3000
      - --electrum-rpc-addr=127.0.0.1:50001
    # The node stays on the host (D-312); docs/12-deployment-and-operations.md section 2.1 "Running electrs".
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - electrs-data:/data
      - ${SR_BITCOIND_DIR:-/var/lib/bitcoind}:/bitcoin:ro
    # No published port: sr-server reaches it as http://electrs:3000 on the compose network only.

  # --- profile: monitoring (FND-OBS-003, XC-OPS-007) -------------------------------------------------
  prometheus:
    <<: *restart
    profiles: [monitoring]
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom-data:/prometheus

  grafana:
    <<: *restart
    profiles: [monitoring]
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?set GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://${SR_DOMAIN}/grafana/
    ports:
      - "127.0.0.1:3000:3000" # reach it over an SSH tunnel; it is not behind Caddy
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  pgdata:
  wal-archive:
  pg-backups:
  garage-meta:
  garage-data:
  caddy-data:
  caddy-config:
  prom-data:
  grafana-data:
  electrs-data:
