# Dev-only coturn config (ADR-0004).
#
# Clients get time-limited credentials from sr-server (GET /api/v1/sr/voice/turn and the
# ice_servers list in VOICE_SERVER_UPDATE): username "<expiry unix seconds>:<user id>",
# password base64(HMAC-SHA1(static-auth-secret, username)). Set the same secret in sr-server:
#   SR_VOICE__TURN__SECRET=dev-turn-shared-secret
#   SR_VOICE__TURN__URLS='["stun:localhost:3478","turn:localhost:3478?transport=udp","turn:localhost:3478?transport=tcp"]'
listening-port=3478
min-port=49152
max-port=49200
fingerprint
use-auth-secret
static-auth-secret=dev-turn-shared-secret
realm=sideroom.localhost
no-tls
no-dtls
no-cli
log-file=stdout
simple-log
# Abuse limits: one user is one allocation burst, the whole relay is capped.
user-quota=12
total-quota=1200
# Production hardening (dev needs LAN and loopback peers, so these stay off here):
#   external-ip=<public IP>          when the server sits behind NAT
#   denied-peer-ip=10.0.0.0-10.255.255.255
#   denied-peer-ip=172.16.0.0-172.31.255.255
#   denied-peer-ip=192.168.0.0-192.168.255.255
#   denied-peer-ip=127.0.0.0-127.255.255.255
#   no-multicast-peers
#   cert=/path/fullchain.pem  pkey=/path/privkey.pem   (and drop no-tls) for turns: on 443
