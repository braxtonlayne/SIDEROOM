[workspace]
resolver = "3"
members = ["crates/*"]
# M-20 (D-310): the serenity sample bot of the SDK compatibility run is its own Cargo project.
exclude = ["e2e/sdk-compat/serenity-bot"]

[workspace.package]
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
async-trait = "0.1"
bitflags = "2"
figment = { version = "0.10", features = ["toml", "env"] }
futures = "0.3"
moka = { version = "0.12", features = ["future"] }
proptest = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = "1"
tokio-stream = { version = "0.1", features = ["sync"] }
wasm-bindgen = "0.2"

# Password hashing is deliberately expensive (argon2id, 64 MiB). An unoptimised build makes
# every login take 1.5 s or more, and several times that under load, which makes local runs
# and the e2e suite flaky. Optimise just the hashing crates in dev/test profiles.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
# Page ingest: libwebp (C), the image resizer and the LZMA decoder are unusably slow at opt-level 0.

[profile.dev.package.libwebp-sys]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.lzma-rust2]
opt-level = 3
[profile.dev.package.unrar_sys]
opt-level = 3
