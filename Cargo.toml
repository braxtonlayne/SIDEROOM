[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "UNLICENSED"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

# Shared dependency versions. Crates opt in with `foo = { workspace = true }`.
# Add new shared deps here (keep alphabetical) rather than pinning in a crate.
[workspace.dependencies]
# internal
sr-core = { path = "crates/sr-core" }
sr-db = { path = "crates/sr-db" }
sr-auth = { path = "crates/sr-auth" }
sr-features = { path = "crates/sr-features" }
sr-events = { path = "crates/sr-events" }
sr-gateway = { path = "crates/sr-gateway" }
sr-api = { path = "crates/sr-api" }
sr-markdown = { path = "crates/sr-markdown" }
sr-permissions = { path = "crates/sr-permissions" }
sr-storage = { path = "crates/sr-storage" }

# external
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["ws", "macros"] }
bitflags = { version = "2", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
figment = { version = "0.10", features = ["toml", "env"] }
futures = "0.3"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "compression-full", "timeout", "cors", "request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "5", features = ["axum_extras", "chrono"] }

[profile.dev.package."*"]
debug = false
