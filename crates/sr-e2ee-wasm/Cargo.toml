[package]
name = "sr-e2ee-wasm"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "wasm-bindgen wrapper over sr-e2ee for the browser's media worker: the frame encryptor, the epoch key ring and privacy codes (VOX-E2E-002, 006, 007)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.23.1"
serde_json.workspace = true
sr-e2ee = { path = "../sr-e2ee" }
wasm-bindgen.workspace = true

[lints]
workspace = true

# openmls draws randomness through getrandom (0.2 via rand_core 0.6, 0.4 via rand) and reads the
# clock (key package lifetimes); in the browser both come from JS.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2.17", features = ["js"] }
getrandom_04 = { package = "getrandom", version = "0.4.3", features = ["wasm_js"] }
openmls = { version = "0.9.1", features = ["js"] }
