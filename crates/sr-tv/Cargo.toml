[package]
name = "sr-tv"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "json"] }
sr-core = { path = "../sr-core", default-features = false }
sr-media = { path = "../sr-media" }
sr-watchparty = { path = "../sr-watchparty" }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = "0.1"
utoipa = "5"

[dev-dependencies]
sr-db = { path = "../sr-db" }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
