[package]
name = "sr-gateway"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[features]
# In-process gateway test client utilities (XC-TEST-002) for other crates dev-dependencies.
test-support = []

[dependencies]
sr-core = { path = "../sr-core", default-features = false }
sr-events = { path = "../sr-events" }
sr-chat = { path = "../sr-chat" }
sr-voice-proto = { path = "../sr-voice-proto" }
async-trait.workspace = true
axum = { version = "0.8", default-features = false, features = ["ws", "query"] }
futures.workspace = true
getrandom = "0.4"
metrics = "0.24"
ruzstd = "0.9.1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }

[lints]
workspace = true
