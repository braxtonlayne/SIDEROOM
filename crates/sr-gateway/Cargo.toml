[package]
name = "sr-gateway"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[features]
# In-process gateway test client utilities (XC-TEST-002) for other crates dev-dependencies.
test-support = []

[dependencies]
sr-core = { path = "../sr-core", default-features = false }
sr-events = { path = "../sr-events" }
sr-chat = { path = "../sr-chat" }
sr-e2ee = { path = "../sr-e2ee" }
sr-voice-proto = { path = "../sr-voice-proto" }
# ARC-GST-001: the guest socket relays through the per-lobby sub-room (sr_voice::lobby), which shares nothing with the call SFU.
sr-voice = { path = "../sr-voice" }
async-trait.workspace = true
axum = { version = "0.8", default-features = false, features = ["ws", "query"] }
futures.workspace = true
base64 = "0.23.1"
getrandom = "0.4"
metrics = "0.24"
ruzstd = "0.9.1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tracing = "0.1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
sr-memcount = { path = "../sr-memcount" }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "std"] }

[lints]
workspace = true
