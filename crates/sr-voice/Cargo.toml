[package]
name = "sr-voice"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lib]
name = "sr_voice"
path = "src/lib.rs"

[[bin]]
name = "sr-voice"
path = "src/main.rs"

[dependencies]
sr-core = { path = "../sr-core", default-features = false }
sr-voice-proto = { path = "../sr-voice-proto" }
anyhow = "1"
async-trait.workspace = true
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "tokio"] }
futures.workspace = true
getrandom = "0.4"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
serde.workspace = true
serde_json.workspace = true
str0m = { version = "0.24.1", default-features = false, features = ["rust-crypto"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
# VOX-E2E-008: the SFU plaintext assertion encrypts test frames; the SFU itself never links it.
sr-e2ee = { path = "../sr-e2ee" }

[lints]
workspace = true
