[package]
name = "sr-preflight"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
bytes = "1"
fs4 = "0.13"
hmac = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde.workspace = true
sha1 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres"] }
sr-core = { path = "../sr-core" }
sr-db = { path = "../sr-db" }
sr-storage = { path = "../sr-storage" }
sr-voice-proto = { path = "../sr-voice-proto" }
tokio = { workspace = true, features = ["net", "time", "io-util", "rt", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
