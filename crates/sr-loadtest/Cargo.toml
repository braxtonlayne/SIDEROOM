[package]
name = "sr-loadtest"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Load test suite for a running sr-server (XC-PERF-003): gateway sessions, message flow, REST latency."

[lints]
workspace = true

[[bin]]
name = "sr-loadtest"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
data-encoding = "2"
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres"] }
sr-auth = { path = "../sr-auth" }
sr-chat = { path = "../sr-chat" }
sr-core = { path = "../sr-core" }
sr-db = { path = "../sr-db" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }
tokio-tungstenite = "0.29"

[dev-dependencies]
sr-api = { path = "../sr-api" }
