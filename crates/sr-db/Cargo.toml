[package]
name = "sr-db"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sr-core = { path = "../sr-core", default-features = false }
sr-chat = { path = "../sr-chat" }
async-trait = "0.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros", "json"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
serde = { workspace = true }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
sr-auth = { path = "../sr-auth" }
sr-admin = { path = "../sr-admin" }
aes-gcm = "0.10"
sha2 = "0.11"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
