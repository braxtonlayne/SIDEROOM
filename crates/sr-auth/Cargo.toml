[package]
name = "sr-auth"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Pure-Rust WebAuthn relying party (F-14 / D-161 spike). Off by default.
webauthn = ["dep:p256", "dep:ed25519-dalek", "dep:crypto-bigint", "dep:ciborium", "dep:serde_json"]

[dependencies]
argon2 = "0.6.0"
async-trait.workspace = true
ciborium = { version = "0.2.2", optional = true }
crypto-bigint = { version = "0.7.5", optional = true, features = ["alloc"] }
data-encoding = "2.11.1"
ed25519-dalek = { version = "3.0.0", optional = true }
getrandom = "0.4.3"
p256 = { version = "0.14.0", optional = true, features = ["ecdsa"] }
serde_json = { workspace = true, optional = true }
sha2 = "0.11.0"
subtle = "2.6.1"
thiserror = "2.0.21"
totp-rs = { version = "6.0.0", features = ["otpauth", "gen_secret"] }
zxcvbn = "3"
