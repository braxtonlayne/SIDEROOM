[package]
name = "sr-storage"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
futures = "0.3.34"
hmac = "0.13.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
object_store = { version = "0.14.2", features = ["aws"] }
sha2 = "0.11.0"
# libwebp bindings for animated WebP output (ADR-0005; pure-Rust encoders are lossless and
# still-only). No `img` feature: raw RGBA goes in.
webp = { version = "0.3.1", default-features = false }
subtle = "2.6.1"
thiserror = "2.0.21"

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt", "net", "io-util", "time"] }
