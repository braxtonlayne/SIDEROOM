[package]
name = "sr-sdk"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Typed bot SDK for SIDE ROOM: REST client, gateway shard manager, cache and command framework"

[lints]
workspace = true

[features]
# P15-DEV-5: bots in voice are on by default now that the transport exists.
default = ["voice-e2ee", "voice-transport", "voice-opus"]
# DEV-BOT-007: the end-to-end encryption half of bots in voice (MLS key agreement and the frame transform),
# on the same sr-e2ee crate as the browser client. On by default (D-268); opt out with `default-features = false`
# (drops openmls and p256).
voice-e2ee = ["dep:sr-e2ee", "dep:p256", "dep:base64"]
# DEV-BOT-007: the media transport of bots in voice (SFU WebSocket, WebRTC via str0m, Opus frames). On by
# default (D-268); opt out with `default-features = false` (drops str0m).
voice-transport = ["dep:str0m"]
# DEV-FU-002 (D-377, D-378): an Opus encoder and decoder for bots (audio.rs). Builds libopus 1.6.1 from the vendored
# source of opusic-sys with cmake (already needed by aws-lc-sys); opt out with `default-features = false` and no C
# code is built. D-201 stands: nothing in sr-voice, sr-api or sr-server links it.
voice-opus = ["dep:opus"]

[dependencies]
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing = "0.1"
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "time", "sync", "macros", "net"] }
# The SDK talks to the server its operator names (a bot's own base URL), not to user-supplied
# addresses, so it is on the `reqwest` wrapper list in deny.toml (D-234).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tokio-tungstenite = { version = "0.29", features = ["connect", "rustls-tls-native-roots"] }
base64 = { version = "0.23.1", optional = true }
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "std"], optional = true }
sr-e2ee = { path = "../sr-e2ee", optional = true }
str0m = { version = "0.24.1", default-features = false, features = ["rust-crypto"], optional = true }
# D-377, D-378: an Opus encoder for bots (libopus 1.6.1 vendored by opusic-sys, built with cmake). The
# `voice-opus` feature turns it on (DEV-FU-002); D-201 (no libopus in the server) stands.
opus = { version = "0.4.0", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "time", "sync", "macros", "net", "test-util", "rt-multi-thread"] }
# The server side of op 8 is tested against the real gateway state machine (H-52).
sr-gateway = { path = "../sr-gateway", features = ["test-support"] }
sr-core = { path = "../sr-core", default-features = false }
# The transport is tested against the real SFU, in process, on loopback.
sr-voice = { path = "../sr-voice" }
sr-voice-proto = { path = "../sr-voice-proto" }
sr-events = { path = "../sr-events" }
axum = { version = "0.8", default-features = false, features = ["ws", "http1", "tokio"] }

[[test]]
name = "voice_e2ee"
required-features = ["voice-e2ee"]

[[test]]
name = "voice_transport"
required-features = ["voice-transport"]

[[example]]
name = "echo_bot"

[[example]]
name = "voice_bot"
required-features = ["voice-transport", "voice-e2ee"]

[[test]]
name = "voice_reconnect"
required-features = ["voice-transport"]
