[package]
name = "sr-library-wasm"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Browser pre-checks for Library uploads (LIB-ING-009): reads a CBZ's central directory and judges it with the same rules as the server (sr-library-rules)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json.workspace = true
sr-library-rules = { path = "../sr-library-rules" }
wasm-bindgen.workspace = true

[dev-dependencies]
wasm-bindgen-test = "0.3.79"

# The parity tests run natively only; the server crate does not build for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
sr-library = { path = "../sr-library" }
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
