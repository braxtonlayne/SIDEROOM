[package]
name = "sr-memcount"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Test helper: a global allocator that counts the live heap bytes of the current thread (RDY-PERF-004)."

# Deliberately no `[lints] workspace = true`: the workspace forbids `unsafe_code`, and a GlobalAlloc impl is
