[package]
name = "sr-library"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
bytes = "1"
blurhash = { version = "0.2.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
quick-xml = { version = "0.42.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
sr-core = { path = "../sr-core", default-features = false }
sr-storage = { path = "../sr-storage" }
tantivy = "0.26"
tempfile = "3"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = "0.1"
utoipa = "5"
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2"] }
webp = "0.3.1"
sevenz-rust2 = { version = "0.24.0", default-features = false, features = ["aes256", "bzip2", "ppmd"] }
# unrar_sys vendors the UnRAR source under the RARLAB freeware licence (decompression only), though
# its manifest says MIT OR Apache-2.0; see docs/dev/handoff/feat-p3-library-ingest.md.
unrar = "0.5.8"

[dev-dependencies]
sevenz-rust2 = { version = "0.24.0", default-features = false, features = ["aes256", "bzip2", "ppmd", "compress"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
