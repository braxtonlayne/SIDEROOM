[package]
name = "sr-tools-wasm"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "The utility drawer's pure logic (wave 32): three-stage search, calculator, units, percent, dice, diff, hash, GIF and palette. One module per tool, each owned by one agent."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json.workspace = true
# Already in the lock (UTL-SRC-001): fuzzy matching and diacritic folding for the search.
strsim = "0.11.1"
unicode-normalization = "0.1"
wasm-bindgen.workspace = true
# Already in the lock (via image): the encoder for the GIF maker. Its own quantiser feature is off; ours is in gif.rs.
gif = { version = "0.14.2", default-features = false, features = ["std"] }

[dev-dependencies]
wasm-bindgen-test = "0.3.79"

[lints]
workspace = true
