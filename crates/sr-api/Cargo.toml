[package]
name = "sr-api"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
bytes = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "matched-path", "original-uri", "tracing"] }
data-encoding = "2"
futures.workspace = true
governor = "0.8"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-rustls-tls"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
sr-admin = { path = "../sr-admin" }
sr-apps = { path = "../sr-apps" }
sr-auth = { path = "../sr-auth", features = ["webauthn"] }
sr-features = { path = "../sr-features" }
sr-library = { path = "../sr-library" }
sr-cinema = { path = "../sr-cinema" }
sr-media = { path = "../sr-media" }
sr-reader = { path = "../sr-reader" }
sr-tv = { path = "../sr-tv" }
sr-cinema-social = { path = "../sr-cinema-social" }
sr-watchparty = { path = "../sr-watchparty" }
sr-payments = { path = "../sr-payments" }
sr-review = { path = "../sr-review" }
sr-chat = { path = "../sr-chat" }
sr-core = { path = "../sr-core" }
sr-events = { path = "../sr-events" }
sr-markdown = { path = "../sr-markdown" }
sr-search = { path = "../sr-search" }
sr-unfurl = { path = "../sr-unfurl" }
sr-storage = { path = "../sr-storage" }
subtle = "2"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "compression-gzip", "compression-br", "timeout", "cors", "request-id", "propagate-header"] }
tracing = "0.1"
url = "2"
oauth2 = "5"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
utoipa = "5"
utoipa-scalar = { version = "0.3", features = ["axum"] }
moka.workspace = true

[dev-dependencies]
sr-chat = { path = "../sr-chat", features = ["memory"] }
http-body-util = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres"] }
sr-db = { path = "../sr-db" }
ciborium = "0.2.2"
p256 = { version = "0.14.0", features = ["ecdsa"] }
