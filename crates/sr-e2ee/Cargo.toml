[package]
name = "sr-e2ee"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Voice/video end-to-end encryption: MLS key agreement (openmls), the per-frame AES-128-GCM transform (codec-aware), sender keys, the epoch key ring, privacy codes and the delivery-service commit sequencer. Also compiled to WASM (sr-e2ee-wasm)."

[dependencies]
# RustCrypto only (docs/03). `aes-gcm` without default features: no getrandom, so the crate
# builds for wasm32 unchanged; callers pass randomness in.
aes = "0.8.4"
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes"] }
ctr = "0.9.2"
hkdf = "0.12.4"
openmls = "0.9.1"
openmls_basic_credential = "0.6.0"
openmls_rust_crypto = "0.6.0"
openmls_traits = "0.6.0"
p256 = { version = "0.13.2", default-features = false, features = ["ecdsa", "std"] }
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror.workspace = true
zeroize = "1.8"

[lints]
workspace = true

[dev-dependencies]
serde_json.workspace = true
