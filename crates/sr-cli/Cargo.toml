[package]
name = "sr-cli"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "sr-cli"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
rpassword = "7"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres"] }
sr-admin = { path = "../sr-admin" }
sr-api = { path = "../sr-api" }
sr-auth = { path = "../sr-auth" }
sr-chat = { path = "../sr-chat" }
sr-core = { path = "../sr-core" }
sr-db = { path = "../sr-db" }
sr-storage = { path = "../sr-storage" }
sr-theme = { path = "../sr-theme" }
serde_json.workspace = true
sha2 = "0.11"
url = "2.5.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
