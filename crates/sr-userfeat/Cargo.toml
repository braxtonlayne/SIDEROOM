[package]
name = "sr-userfeat"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
quick-xml = { version = "0.42.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "json", "derive"] }
sr-core = { path = "../sr-core", default-features = false }
sr-features = { path = "../sr-features" }
sr-net = { path = "../sr-net" }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing = "0.1"
url = "2"
utoipa = "5"

[dev-dependencies]
sr-db = { path = "../sr-db" }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
