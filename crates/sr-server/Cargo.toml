[package]
name = "sr-server"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "sr_server"
path = "src/lib.rs"

[[bin]]
name = "sr-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
fs4 = "0.13"
async-trait.workspace = true
futures.workspace = true
tokio-stream.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
serde.workspace = true
serde_json.workspace = true
url = "2.5.8"
thiserror.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "json"] }
sr-admin = { path = "../sr-admin" }
sr-activities = { path = "../sr-activities" }
sr-packages = { path = "../sr-packages" }
sr-api = { path = "../sr-api" }
sr-apps = { path = "../sr-apps" }
sr-auth = { path = "../sr-auth", features = ["webauthn"] }
sr-chat = { path = "../sr-chat" }
sr-core = { path = "../sr-core" }
sr-db = { path = "../sr-db" }
sr-events = { path = "../sr-events" }
sr-features = { path = "../sr-features" }
sr-gateway = { path = "../sr-gateway" }
sr-library = { path = "../sr-library" }
sr-net = { path = "../sr-net" }
sr-push = { path = "../sr-push" }
sr-library-social = { path = "../sr-library-social" }
sr-cinema = { path = "../sr-cinema" }
sr-media = { path = "../sr-media" }
sr-payments = { path = "../sr-payments" }
sr-cinema-social = { path = "../sr-cinema-social" }
sr-tv = { path = "../sr-tv" }
sr-watchparty = { path = "../sr-watchparty" }
sr-review = { path = "../sr-review" }
sr-search = { path = "../sr-search" }
sr-unfurl = { path = "../sr-unfurl" }
sr-userfeat = { path = "../sr-userfeat" }
sr-voice = { path = "../sr-voice" }
sr-voice-proto = { path = "../sr-voice-proto" }
sr-storage = { path = "../sr-storage" }
bytes = "1"
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"
# Exact pin (D-306): the newest 0.12.x release that was at least two weeks old when added (2025-12-20).
# serenity insists on a TLS backend (rustls_backend; native-tls is banned). It pulls rustls 0.22, whose
# advisories are listed in deny.toml with reasons; used only by examples/serenity_bot.rs.
serenity = { version = "=0.12.5", optional = true, default-features = false, features = ["client", "gateway", "model", "http", "rustls_backend"] }

[dev-dependencies]
zip = { version = "9.0.2", default-features = false, features = ["deflate-flate2"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
sr-chat = { path = "../sr-chat", features = ["memory"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

[features]
default = []
# M-16 / D-306 (DEV-SDK-003): the serenity sample bot of the weekly SDK compatibility workflow
# (`.github/workflows/sdk-compat.yml`). Off by default, so a normal workspace build never compiles serenity.
sdk-compat = ["dep:serenity"]

[[example]]
name = "serenity_bot"
required-features = ["sdk-compat"]
