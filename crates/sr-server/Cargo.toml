[package]
name = "sr-server"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "sr_server"
path = "src/lib.rs"

[[bin]]
name = "sr-server"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait.workspace = true
futures.workspace = true
tokio-stream.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "json"] }
sr-admin = { path = "../sr-admin" }
sr-api = { path = "../sr-api" }
sr-auth = { path = "../sr-auth", features = ["webauthn"] }
sr-chat = { path = "../sr-chat" }
sr-core = { path = "../sr-core" }
sr-db = { path = "../sr-db" }
sr-events = { path = "../sr-events" }
sr-features = { path = "../sr-features" }
sr-gateway = { path = "../sr-gateway" }
sr-library = { path = "../sr-library" }
sr-review = { path = "../sr-review" }
sr-search = { path = "../sr-search" }
sr-unfurl = { path = "../sr-unfurl" }
sr-storage = { path = "../sr-storage" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
sr-chat = { path = "../sr-chat", features = ["memory"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
