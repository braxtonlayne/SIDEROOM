tracing = "0.1"
utoipa = "5"

[dev-dependencies]
async-trait.workspace = true
sr-db = { path = "../sr-db" }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
