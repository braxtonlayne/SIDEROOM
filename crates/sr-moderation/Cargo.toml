[package]
name = "sr-moderation"
version = "0.0.0"
edition.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "json", "derive"] }
sr-admin = { path = "../sr-admin" }
sr-core = { path = "../sr-core", default-features = false }
sr-db = { path = "../sr-db" }
sr-packages = { path = "../sr-packages" }
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
tracing = "0.1"
utoipa = "5"

[dev-dependencies]
sr-auth = { path = "../sr-auth" }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints]
workspace = true
