# cargo-deny configuration (FND-REPO-006). Run: cargo deny check
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # proc-macro-error2 is unmaintained with no safe upgrade. It is a compile-time helper of
  # hax-lib-macros, reached only through hpke-rs -> libcrux-sha3, which openmls_rust_crypto (the
  # approved MLS provider, D-249) needs; it never ends up in the shipped binary. Revisit when
  # hpke-rs or libcrux drop it.
  { id = "RUSTSEC-2026-0173", reason = "build-time proc-macro of the MLS crypto provider; no safe upgrade" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
    # Permissive: BSD-style (quoted_printable via lettre) and the data licence for root certs
    # (webpki-roots / webpki-root-certs).
    "0BSD",
    "CDLA-Permissive-2.0",
    # libbz2-rs-sys (7z BZip2 coder): the permissive bzip2 licence.
    "bzip2-1.0.6",
]

# Our own workspace crates are private (publish = false) and carry no licence expression.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between workspace crates have no version requirement.
allow-wildcard-paths = true
highlight = "all"
deny = [
    # TLS is rustls only; no system OpenSSL linkage.
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "native-tls" },
    # D-203: every outbound request to a non-constant address goes through sr_net::SafeClient.
    # `wrappers` lists the only crates allowed to depend on reqwest directly, or through
    # `oauth2` (fixed-URL Discord OAuth) and `object_store` (S3)). A new crate that
    # adds a reqwest dependency fails this check; add it here only with a decision.
    # sr-sdk is the bot SDK: it connects to the server its operator names, never to an address a
    # user supplied (D-234: only the base host and allow-listed hosts are followed).
    # sr-push, sr-storage, sr-transcoder and sr-unfurl are grandfathered: operator-configured
    # fixed endpoints (push services, S3, transcoder worker) or SafeClient transports.
    { crate = "reqwest", wrappers = [
        "sr-net",
        "sr-unfurl",
        "sr-push",
        "sr-sdk",
        "sr-storage",
        "sr-transcoder",
        "oauth2",
        "object_store",
    ] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
