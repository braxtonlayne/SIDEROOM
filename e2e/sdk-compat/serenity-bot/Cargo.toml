# serenity sample bot of the weekly SDK compatibility run (M-16, D-306; moved out of the workspace by M-20, D-310).
# Its own Cargo project (the empty [workspace] table makes it a root), so the root workspace, its Cargo.lock and
# its deny.toml never see serenity or the rustls 0.22 tree it pins. Build and check:
#   cargo build -j 2 --manifest-path e2e/sdk-compat/serenity-bot/Cargo.toml
#   cargo deny check --manifest-path e2e/sdk-compat/serenity-bot/Cargo.toml
[package]
name = "sideroom-serenity-bot"
version = "0.0.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[workspace]

[dependencies]
# Exact pin (D-306): the newest 0.12.x release that was at least two weeks old when added (2025-12-20).
# serenity insists on a TLS backend (rustls_backend; native-tls is banned). It pulls rustls 0.22, whose
# advisories are listed in this project's deny.toml with reasons.
serenity = { version = "=0.12.5", default-features = false, features = ["client", "gateway", "model", "http", "rustls_backend"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
