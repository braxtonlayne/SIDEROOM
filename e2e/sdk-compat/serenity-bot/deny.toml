# cargo-deny configuration of the serenity sample bot (M-20, D-310): the root deny.toml's policy (graph,
# licences, bans, sources) with the six RUSTSEC ignores and the serenity reqwest wrapper only this project needs.
# Run: cargo deny check --manifest-path e2e/sdk-compat/serenity-bot/Cargo.toml
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2026-0049", reason = "serenity 0.12 (sdk-compat feature, M-16) pins rustls 0.22 / rustls-webpki 0.102; test-only sample bot talking to a local test server, never in a shipped binary; revisit with serenity 0.13" },
  { id = "RUSTSEC-2026-0098", reason = "serenity 0.12 (sdk-compat feature, M-16) pins rustls 0.22 / rustls-webpki 0.102; test-only sample bot talking to a local test server, never in a shipped binary; revisit with serenity 0.13" },
  { id = "RUSTSEC-2026-0099", reason = "serenity 0.12 (sdk-compat feature, M-16) pins rustls 0.22 / rustls-webpki 0.102; test-only sample bot talking to a local test server, never in a shipped binary; revisit with serenity 0.13" },
  { id = "RUSTSEC-2026-0104", reason = "serenity 0.12 (sdk-compat feature, M-16) pins rustls 0.22 / rustls-webpki 0.102; test-only sample bot talking to a local test server, never in a shipped binary; revisit with serenity 0.13" },
  { id = "RUSTSEC-2026-0346", reason = "serenity 0.12 (sdk-compat feature, M-16) pins rustls 0.22 / rustls-webpki 0.102; test-only sample bot talking to a local test server, never in a shipped binary; revisit with serenity 0.13" },
  { id = "RUSTSEC-2026-0349", reason = "serenity 0.12 (sdk-compat feature, M-16) pins rustls 0.22 / rustls-webpki 0.102; test-only sample bot talking to a local test server, never in a shipped binary; revisit with serenity 0.13" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OpenSSL",
    # Permissive: BSD-style (quoted_printable via lettre) and the data licence for root certs
    # (webpki-roots / webpki-root-certs).
    "0BSD",
    "CDLA-Permissive-2.0",
    # libbz2-rs-sys (7z BZip2 coder): the permissive bzip2 licence.
    "bzip2-1.0.6",
]

# Our own workspace crates are private (publish = false) and carry no licence expression.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between workspace crates have no version requirement.
allow-wildcard-paths = true
highlight = "all"
deny = [
    # TLS is rustls only; no system OpenSSL linkage.
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "native-tls" },
    # D-203 (root deny.toml): reqwest only through approved wrappers. Here the only one is serenity, the
    # sample bot of the SDK compatibility workflow (M-16), which is not in any shipped binary.
    { crate = "reqwest", wrappers = ["serenity"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
